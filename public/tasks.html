<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一次性事务 - 生活驾驶舱</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%233b82f6'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>家</text></svg>">
    <link rel="stylesheet" href="/css/theme/01-base.css?v=1.48.54">
    <link rel="stylesheet" href="/css/theme/02-late.css?v=1.48.54">
    <link rel="stylesheet" href="/css/components.css?v=1.48.54">
    <style>
        /* 移动端首屏避让：压缩日历与事务面板顶部间距，使「普通事务/置顶事务/统计」切换标签上移出底部 Tab 栏遮挡带（P0 G1，仅 ≤768px 生效） */
        @media (max-width: 768px) {
            .tasks-flex { gap: 10px; }
            .tasks-flex .calendar-container { padding: 12px; }
            .tasks-flex .calendar-header { margin-bottom: 8px; }
            .tasks-flex .header-row-top { margin-bottom: 8px; }
            .tasks-flex .day-card { padding: 8px 10px; }
        }
    </style>


<style>
/* === v54·B3 收敛：公共交互增强已并入 theme/，此处仅保留本页专属规则 === */
@media (max-width: 768px) {
  .icon-btn, .iconbtn, .icon-button, .fp-icobtn, .rt-btn, .chip-x, .note-pin-btn, .notes-back-btn, .set-arrow, .tr-arrow, .h-addbtn, .ma-btn, .chip-btn, .share-icons span, .calendar-nav button { min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }
  .icon-btn svg, .iconbtn svg, .icon-button svg, .fp-icobtn svg, .rt-btn svg, .chip-x svg, .note-pin-btn svg, .notes-back-btn svg, .set-arrow svg, .tr-arrow svg { width: 20px; height: 20px; }
}
</style>

</head>
<body>
    <div id="pageContent" style="display:none;">
        <div class="tasks-flex">
            <!-- 左侧：日历 -->
            <div class="calendar-container" id="calendarContainer">
                <div class="calendar-header">
                    <h3 id="calendarTitle">--</h3>
                    <div class="calendar-nav">
                        <button onclick="prevMonth()" aria-label="上一月" title="上一月">&lt;</button>
                        <button class="today-btn" onclick="goToday()">今天</button>
                        <button onclick="nextMonth()" aria-label="下一月" title="下一月">&gt;</button>
                    </div>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
                <div class="day-cards" id="dayCards"></div>
            </div>

            <!-- 右侧：事务面板 -->
            <div class="task-panel">
                <!-- 第1行：顶级导航（左） + 年份/导入/添加（右） -->
                <div class="header-row header-row-top">
                    <div class="nav-tabs">
                        <button class="nav-tab active" data-nav="normal" onclick="switchNav('normal')">普通事务</button>
                        <button class="nav-tab" data-nav="pinned" onclick="switchNav('pinned')">置顶事务</button>
                        <button class="nav-tab" data-nav="stat" onclick="switchNav('stat')">统计</button>
                    </div>
                    <div class="nav-actions">
                        <div class="task-search-wrapper">
                            <input type="search" id="taskSearch" class="task-search-input"
                                   placeholder="搜索事务…" aria-label="按关键字搜索事务" autocomplete="off">
                        </div>
                        <div class="task-year-select-wrapper" id="yearSelectWrapper">
                            <button class="btn btn-secondary btn-xs" id="yearSelectBtn" onclick="toggleYearDropdown(event)" aria-haspopup="listbox" aria-label="选择年份">
                                <span id="yearSelectLabel">2026年</span>
                                <svg class="task-year-arrow" width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="currentColor"></path></svg>
                            </button>
                            <div class="task-year-dropdown" id="yearDropdown"></div>
                        </div>
                        <button class="btn btn-outline btn-xs" onclick="openTaskImportModal()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Excel 导入</button>
                        <button class="btn btn-primary btn-xs" id="addTaskBtn" onclick="showAddTaskModal()">+ 添加事务</button>
                    </div>
                </div>

                <div class="outer-card">
                    <!-- 第2行：子Tab（左） + 辅助项（右） -->
                    <div class="outer-card-header">
                        <div class="header-row header-row-bottom">
                            <div class="sub-tabs sub-tabs-normal" id="subTabsNormal">
                                <button class="sub-tab active" data-tab="today" id="subTabToday" onclick="switchNormalTab('today')">当天</button>
                                <button class="sub-tab" data-tab="month" onclick="switchNormalTab('month')">当月</button>
                            </div>
                            <div class="sub-tabs sub-tabs-pinned" id="subTabsPinned" style="display:none;">
                                <span class="sub-title-gray">置顶事务</span>
                            </div>
                            <div class="sub-tabs sub-tabs-stat" id="subTabsStat" style="display:none;">
                                <button class="sub-tab" data-dim="day" onclick="switchStatDim('day')">日</button>
                                <button class="sub-tab" data-dim="week" onclick="switchStatDim('week')">周</button>
                                <button class="sub-tab" data-dim="month" onclick="switchStatDim('month')">月</button>
                                <button class="sub-tab" data-dim="quarter" onclick="switchStatDim('quarter')">季</button>
                                <button class="sub-tab" data-dim="year" onclick="switchStatDim('year')">年</button>
                            </div>
                            <div class="header-row-right header-row-right-stat" id="headerRightStat" style="display:none;">
                                <span class="detail-count-label">事务明细 (<span id="detailCount">0</span>)</span>
                                <div class="page-size-wrapper" id="pageSizeWrapper">
                                    <button class="btn btn-secondary btn-xs" id="pageSizeBtn" onclick="togglePageSizeDropdown(event)" aria-haspopup="listbox" aria-label="每页条数">
                                        <span id="pageSizeLabel">10条</span>
                                        <svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="currentColor"></path></svg>
                                    </button>
                                    <div class="page-size-dropdown" id="pageSizeDropdown">
                                        <div class="page-size-item active" data-size="10" onclick="selectPageSize(10)">10条</div>
                                        <div class="page-size-item" data-size="20" onclick="selectPageSize(20)">20条</div>
                                        <div class="page-size-item" data-size="50" onclick="selectPageSize(50)">50条</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 外层卡片主体 -->
                    <div class="outer-card-body">
                        <!-- 普通事务 -->
                        <div id="normalTaskPage" class="nav-page active">
                            <div class="inner-card">
                                <div class="inner-card-body">
                                    <div id="searchResultBar" class="search-result-bar" hidden></div>
                                    <div id="normalTaskList"></div>
                                    <div id="normalTaskPagination"></div>
                                </div>
                            </div>
                        </div>
                        <!-- 置顶事务 -->
                        <div id="pinnedTaskPage" class="nav-page">
                            <div class="inner-card">
                                <div class="inner-card-body">
                                    <div id="pinnedTaskList"></div>
                                    <div id="pinnedTaskPagination"></div>
                                </div>
                            </div>
                        </div>
                        <!-- 统计 -->
                        <div id="statPage" class="nav-page">
                            <div class="stat-range-label" id="statRangeLabel"></div>
                            <div class="stat-cards-row">
                                <div class="stat-mini-card">
                                    <div class="stat-mini-icon stat-icon-total"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg></div>
                                    <div class="stat-mini-meta">
                                        <div class="stat-mini-value" id="statTotal">0</div>
                                        <div class="stat-mini-label">总事务</div>
                                    </div>
                                </div>
                                <div class="stat-mini-card">
                                    <div class="stat-mini-icon stat-icon-pending"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 12 16"/></svg></div>
                                    <div class="stat-mini-meta">
                                        <div class="stat-mini-value" id="statPending">0</div>
                                        <div class="stat-mini-label">待处理</div>
                                    </div>
                                </div>
                                <div class="stat-mini-card">
                                    <div class="stat-mini-icon stat-icon-doing"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
                                    <div class="stat-mini-meta">
                                        <div class="stat-mini-value" id="statProgress">0</div>
                                        <div class="stat-mini-label">进行中</div>
                                    </div>
                                </div>
                                <div class="stat-mini-card">
                                    <div class="stat-mini-icon stat-icon-done"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></div>
                                    <div class="stat-mini-meta">
                                        <div class="stat-mini-value" id="statDone">0</div>
                                        <div class="stat-mini-label">已完成</div>
                                    </div>
                                </div>
                            </div>
                            <div class="inner-card">
                                <div class="inner-card-body">
                                    <div id="taskDetailList"></div>
                                    <div id="taskDetailPagination"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 新增/编辑事务弹窗 -->
    <div id="taskModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="taskModalTitle">新增事务</h3>
                <button class="modal-close" onclick="closeModal('taskModal')" aria-label="关闭弹窗">&times;</button>
            </div>
            <div class="modal-body">
                <!-- 事务类型切换 -->
                <div class="task-type-tabs" id="taskTypeTabs">
                    <button class="task-type-tab active" data-type="normal" onclick="switchTaskType('normal')">普通事务</button>
                    <button class="task-type-tab" data-type="pinned" onclick="switchTaskType('pinned')">置顶事务</button>
                </div>
                <div class="form-group">
                    <label>事务名称 * <span style="font-weight:400;color:var(--text-secondary);font-size:12px;">（点 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg> 说话即可 AI 建单）</span></label>
                    <div style="display:flex;gap:8px;align-items:center;">
                        <input type="text" id="tTitle" placeholder="请输入事务名称" aria-label="事务名称" style="flex:1;min-width:0;">
                        <script data-voice-mic data-target="tTitle" data-ai="tasks"></script>
                    </div>
                </div>
                <div class="form-row" id="dateTimeRow">
                    <div class="form-group">
                        <label>日期 <span id="dateRequired">*</span></label>
                        <input type="date" id="tDate" aria-label="事务日期">
                    </div>
                    <div class="form-group">
                        <label>提醒时间</label>
                        <input type="time" id="tRemindTime" aria-label="提醒时间">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>状态</label>
                        <select id="tStatus"></select>
                        <a class="field-link" href="/general-config#statuses">管理状态 →</a>
                    </div>
                    <div class="form-group">
                        <label>颜色标记</label>
                        <select id="tColor">
                            <option value="">默认</option>
                            <option value="#ef4444">红色</option>
                            <option value="#f59e0b">橙色</option>
                            <option value="#3b82f6">蓝色</option>
                            <option value="#8b5cf6">紫色</option>
                            <option value="#10b981">绿色</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>项目 / 客户 <span style="font-weight:400;color:var(--text-secondary);font-size:12px;">（工作事项填这里，首页自动显示 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg> 标签）</span></label>
                        <input type="text" id="tClient" placeholder="如：旌德林业 / 荆州河道局" aria-label="项目或客户" maxlength="40">
                    </div>
                    <div class="form-group">
                        <label>关联家人</label>
                        <select id="tMember" aria-label="关联家人"><option value="">全家人共用</option></select>
                    </div>
                </div>
                <div class="form-group">
                    <label>下一步动作</label>
                    <input type="text" id="tNextAction" placeholder="如：约周三试飞演示" aria-label="下一步动作" maxlength="80">
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea id="tRemark" rows="3" placeholder="备注信息（可选）" aria-label="事务备注"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('taskModal')">取消</button>
                <button class="btn btn-primary" onclick="saveTask()">保存</button>
            </div>
        </div>
    </div>

    <!-- Excel 导入弹窗 -->
    <div class="modal-overlay" id="taskImportModal">
        <div class="modal" style="width:600px;">
            <div class="modal-header">
                <h3 class="modal-title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Excel 导入一次性事务</h3>
                <button class="modal-close" onclick="closeTaskImportModal()" aria-label="关闭导入弹窗">&times;</button>
            </div>
            <div class="modal-body" style="padding:20px;">
                <div style="margin-bottom:16px;font-size:13px;color:var(--text-secondary);line-height:1.8;">
                    <a href="javascript:void(0)" onclick="downloadTaskTemplate()" style="color:var(--primary);text-decoration:underline;font-weight:500;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg> 下载 Excel 模板（含下拉选项）</a>
                </div>
                <div style="margin-bottom:12px;padding:8px 12px;background:var(--primary-light);border-radius:6px;font-size:12px;color:var(--text-secondary);line-height:1.6;">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> 提示：单次最多导入 <strong>500</strong> 条数据，请确保文件格式正确（第一行为表头，第二行起为数据）
                </div>
                <div id="taskImportDropZone" class="import-drop-zone"
                     onclick="document.getElementById('taskImportFileInput').click()"
                     ondragover="event.preventDefault();this.classList.add('dragover')"
                     ondragleave="this.classList.remove('dragover')"
                     ondrop="event.preventDefault();this.classList.remove('dragover');handleTaskImportFile(event.dataTransfer.files[0])">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="width:48px;height:48px;opacity:0.4;margin-bottom:12px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    <p style="margin:0 0 4px 0;font-size:14px;color:var(--text-primary);">点击选择文件或拖拽 Excel 到此处</p>
                    <p style="margin:0;font-size:12px;color:var(--text-secondary);" id="taskImportFileName">未选择文件</p>
                    <input type="file" id="taskImportFileInput" accept=".xlsx,.xls,.csv" style="display:none;" onchange="handleTaskImportFile(this.files[0])">
                </div>
                <div id="taskImportResult" style="display:none;margin-top:16px;max-height:200px;overflow-y:auto;"></div>
            </div>
            <div class="modal-footer" id="taskImportFooter">
                <button class="btn btn-secondary" onclick="closeTaskImportModal()">取消</button>
                <button class="btn btn-primary" id="taskImportStartBtn" onclick="startTaskImport()" disabled>开始导入</button>
            </div>
        </div>
    </div>

    <script src="/js/common.js?v=1.48.54"></script>
    <script src="/js/lunar.js?v=1.48.54"></script>
    <script src="/js/voice.js?v=1.48.54"></script>
    <script src="/js/pwa.js?v=1.48.54"></script>
    <script src="/js/telemetry.js?v=1.48.54"></script>
    <script src="/js/ui.js?v=1.48.54"></script>
    <script>
        renderShell('tasks', '一次性事务');

        /* 空态图标（可信内部 SVG，走 uiEmpty 的 icon 参数） */
        var EMPTY_ICO = {
            search: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
            clipboard: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg>',
            chart: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>'
        };

        /* ---------------- 状态 ---------------- */
        var nowD = new Date();
        var currentYear = nowD.getFullYear();
        var currentMonth = nowD.getMonth() + 1;
        var selectedDate = todayStr();
        var statuses = [];
        var statusColorMap = {};

        var currentNav = 'normal';       // normal | pinned | stat
        var currentNormalTab = 'today';  // today | month
        var currentStatDim = 'day';      // day | week | month | quarter | year

        var taskDates = [];              // 有事务的日期
        var dateStatusCounts = {};       // date -> {statusId: count}
        var holidays = {};               // date -> {name, type}

        var pageState = {
            today: { page: 1, size: 20, total: 0 },
            month: { page: 1, size: 20, total: 0 },
            pinned: { page: 1, size: 20, total: 0 }
        };
        // 普通事务列表：滚动加载（首屏 size=50，滚动到底按 hasMore 累积翻页）
        var NORMAL_PAGE_SIZE = 50;
        var normalLoaded = [];
        var normalHasMore = false;
        var normalLoading = false;
        var normalObserver = null;
        var statTasks = [];
        var statPage = 1, statTotalPages = 1, statPageSize = 10
        ;
        var editingId = null;
        var editingPinned = false;
        var importParsedRows = [];
        /* P1-1：事务可关联家人（与周期事项/纪念日一致） */
        var familyMembers = [];
        var memberPrefillId = (function () {
            var m = (location.search || '').match(/[?&]memberId=(\d+)/);
            return m ? parseInt(m[1], 10) : 0;
        })();
        var fromScheduledId = (function () {
            var m = (location.search || '').match(/[?&]fromScheduled=(\d+)/);
            return m ? parseInt(m[1], 10) : 0;
        })();

        /* ---------------- 初始化 ---------------- */
        async function init() {
            await loadStatuses();
            buildStatusColorMap();
            await loadFamilyMembers();
            await loadHolidays(currentYear);
            await refreshMonth();
            renderCalendar();
            renderYearDropdown();
            updateSubTabTodayLabel();
            initCalendarKeyboard();
            bindSearch();
            bindTaskFormValidation();
            loadNormalTasks();
            if (fromScheduledId) prefillFromScheduled();
        }

        /* 循环事务 → 一次性：预填新建弹窗（跳转带入） */
        async function prefillFromScheduled() {
            var r = await apiGet('/api/scheduled-tasks');

        function renderCalendar() {
            document.getElementById('calendarTitle').textContent = currentYear + '年' + currentMonth + '月';
            var grid = document.getElementById('calendarGrid');
            // 周起始为周一（中文习惯）
            var weekdays = ['一', '二', '三', '四', '五', '六', '日'];
            var h = weekdays.map(w => '<div class="calendar-weekday">' + w + '</div>').join('');
            var first = new Date(currentYear, currentMonth - 1, 1);
            var start = (first.getDay() + 6) % 7;    // 周一 = 0 … 周日 = 6
            var today = todayStr();

            // 固定 42 格；每格带真实日期（相邻月日期也可点击跳月）
            var cells = [];
            var cursor = new Date(currentYear, currentMonth - 1, 1 - start);
            for (var i = 0; i < 42; i++) {
                var dt = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate() + i);
                cells.push({
                    d: dt.getDate(),
                    cur: dt.getFullYear() === currentYear && dt.getMonth() === currentMonth - 1,
                    date: dt.getFullYear() + '-' + pad2(dt.getMonth() + 1) + '-' + pad2(dt.getDate())
                });
            }

            cells.forEach(function (c) {
                var date = c.date;
                var isToday = c.cur && date === today;
                var cls = ['calendar-day'];
                if (!c.cur) cls.push('other');
                if (isToday) cls.push('today');
                if (date === selectedDate) cls.push('selected');

                // 注释文本（仅本月格显示）：今天 > 节假日首日 > 每月 1 日 > 农历
                var sub = '';
                if (c.cur) {
                    var hol = holidayOf(date);
                    var holStart = false;
                    if (hol && hol.name) {
                        // 连续假期只在首日显示名称：向前回溯 7 天查找同名节日
                        // （回溯而非只比前一天，避免"国庆-中秋-国庆"这类夹花假期重复显示）
                        holStart = true;
                        for (var back = 1; back <= 7; back++) {
                            var pd = new Date(currentYear, currentMonth - 1, c.d - back);
                            var pds = pd.getFullYear() + '-' + pad2(pd.getMonth() + 1) + '-' + pad2(pd.getDate());
                            var prevHol = holidayOf(pds);
                            if (prevHol && prevHol.name === hol.name) { holStart = false; break; }
                        }
                    }
                    if (isToday) {
                        sub = '<span class="day-today-tag">今天</span>';
                    } else if (holStart) {
                        sub = '<span class="day-holiday">' + escapeHtml(hol.name) + '</span>';
                    } else if (c.d === 1) {
                        sub = '<span>' + currentMonth + '月</span>';
                    } else {
                        try {
                            var l = solarToLunar(new Date(currentYear, currentMonth - 1, c.d));
                            sub = '<span>' + (l.day === 1 ? (l.isLeap ? '闰' : '') + l.monthStr + '月' : l.dayStr) + '</span>';
                        } catch (e) { sub = ''; }
                    }
                }

                // 状态点：每种状态一个点（按状态色），超过 3 种显示 +N
                var dots = '';
                var taskCount = 0;
                var sm = dateStatusCounts[date];
                if (sm) {
                    var ids = Object.keys(sm).filter(k => sm[k] > 0).map(Number).sort((a, b) => a - b);
                    var total = 0; ids.forEach(id => { total += sm[id]; });
                    taskCount = total;
                    if (total > 0) {
                        var dotHtml = ids.slice(0, 3).map(id => '<i style="background:' + statusColor(id) + '"></i>').join('');
                        if (ids.length > 3) dotHtml += '<i class="dot-more">+' + (ids.length - 3) + '</i>';
                        var tip = ids.map(id => statusName(id) + ' ' + sm[id]).join(' · ');
                        dots = '<div class="task-dots" title="' + escapeHtml(tip) + '">' + dotHtml + '</div>';
                    }
                }

                var dd = new Date(date + 'T00:00:00');
                var holA = holidayOf(date);
                var ariaLabel = dd.getFullYear() + '年' + (dd.getMonth() + 1) + '月' + dd.getDate() + '日 ' + weekCN(dd)
                    + (c.cur && holA && holA.type === 'holiday' ? '，' + holA.name + '（法定节假日，休息）' : (c.cur && holA && holA.name ? ' ' + holA.name : ''))
                    + '，' + taskCount + ' 项事务'
                    + (c.cur ? '' : '（点击切换到该月）');
                var tabIdx = (c.cur && date === selectedDate) ? '0' : '-1';
                h += '<button type="button" class="' + cls.join(' ') + '" data-date="' + date + '" tabindex="' + tabIdx + '"'
                    + ' aria-label="' + escapeHtml(ariaLabel) + '"'
                    + ' onclick="gotoDate(\'' + date + '\')"'
                    + ' ondblclick="quickAddTask(\'' + date + '\')">'
                    + '<span class="day-num">' + c.d + '</span>'
                    + '<div class="day-lunar">' + sub + '</div>'
                    + dots + '</button>';
            });
            grid.innerHTML = h;
            // 若本月无选中日（如选中日不在当前视口），把 roving tabindex 落到首个本月格
            if (!grid.querySelector('.calendar-day[tabindex="0"]')) {
                var firstCur = grid.querySelector('.calendar-day:not(.other)[data-date]');
                if (firstCur) firstCur.setAttribute('tabindex', '0');
            }
            renderDayCards();
        }

            '破': { yi: ['拆除', '破屋', '求医', '治病'], ji: ['嫁娶', '签约', '开市', '出行'] },
            '危': { yi: ['安床', '祭祀', '修缮'], ji: ['登高', '行船', '出行', '嫁娶'] },
            '成': { yi: ['开业', '嫁娶', '入学', '签约', '搬家'], ji: ['诉讼', '争执', '词讼'] },
            '收': { yi: ['纳财', '买入', '收藏', '收获'], ji: ['出行', '开市', '安葬', '置产'] },
            '开': { yi: ['开业', '求职', '见贵', '出行', '结婚'], ji: ['安葬', '破土', '修坟'] },
            '闭': { yi: ['安葬', '修坟', '填井', '打扫'], ji: ['开业', '出行', '嫁娶', '动土'] }
        };
        function jdnOf(y, m, d) {
            var a = Math.floor((14 - m) / 12), yy = y + 4800 - a, mm = m + 12 * a - 3;
            return d + Math.floor((153 * mm + 2) / 5) + 365 * yy + Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045;
        }
        /** 日干支：以 1949-10-01 甲子日为锚点 */
        function dayGanzhi(y, m, d) {
            var idx = ((jdnOf(y, m, d) - 2433191) % 60 + 60) % 60;
            return { gan: GAN.charAt(idx % 10), zhi: ZHI.charAt(idx % 12), idx: idx };
        }
        /** 月建（日支 == 月支 为「建」日）：取不晚于当日的最近一个十二节 */
        function monthBranchOf(y, m, d) {
            var target = y * 10000 + m * 100 + d, best = -1, cur = '寅';
            for (var yy = y - 1; yy <= y; yy++) {
                JIE.forEach(function (j) {
                    var k = yy * 10000 + j[0] * 100 + j[1];
                    // 必须取「日期最大且不晚于当日」的一个：1 月小寒在数组末尾，若按顺序覆盖会把已选中的后续月份冲掉
                    if (k <= target && k > best) { best = k; cur = j[2]; }
                });
            }
            return cur;
        }
        function almanacOf(dateStr) {
            var p = dateStr.split('-').map(Number);
            var y = p[0], m = p[1], d = p[2];
            var gz = dayGanzhi(y, m, d);
            var zhiIdx = ZHI.indexOf(gz.zhi);
            var mbIdx = ZHI.indexOf(monthBranchOf(y, m, d));
            var god = ZHI12[((zhiIdx - mbIdx) % 12 + 12) % 12];
            var chongZhi = ZHI.charAt((zhiIdx + 6) % 12);
            var yiji = YIJI[god];
            return { gz: gz.gan + gz.zhi, god: god, chong: '冲' + ZHI_SHENG[chongZhi] + '（' + chongZhi + '）', yi: yiji.yi, ji: yiji.ji };
        }
        function almanacCardHtml(d) {
            var a = almanacOf(selectedDate);
            return '<div class="tick-row tick-almanac">'
                + '<span class="yi">宜 ' + a.yi.join('、') + '</span>'
                + '<span class="ji">忌 ' + a.ji.join('、') + '</span>'

        }
        /** 状态点图例（复用 statusColorMap / statusName，动态跟随自定义状态） */
        function statusLegendHtml() {

        /* ---------------- 日历键盘可达 ---------------- */
        function focusCalendarCell() {
            var grid = document.getElementById('calendarGrid');
            if (!grid) return;

            if (cell) { try { cell.focus(); } catch (e) { } }
        }
        function initCalendarKeyboard() {
            var grid = document.getElementById('calendarGrid');
            if (!grid) return;
            grid.addEventListener('keydown', function (e) {
                var cur = e.target.closest && e.target.closest('.calendar-day[data-date]');
                if (!cur) return;
                // Enter / Space 交由原生 button 触发 onclick
                if (e.key === 'Enter' || e.key === ' ') return;
                if (e.key === 't' || e.key === 'T' || e.key === 'Home') {
                    e.preventDefault(); goToday(); setTimeout(focusCalendarCell, 90); return;
                }
                var delta = 0;
                if (e.key === 'ArrowLeft') delta = -1;
                else if (e.key === 'ArrowRight') delta = 1;
                else if (e.key === 'ArrowUp') delta = -7;
                else if (e.key === 'ArrowDown') delta = 7;
                else return;
                e.preventDefault();
                var nd = new Date(cur.dataset.date + 'T00:00:00');
                nd.setDate(nd.getDate() + delta);
                var nds = nd.getFullYear() + '-' + pad2(nd.getMonth() + 1) + '-' + pad2(nd.getDate());
                selectedDate = nds;
                if (nd.getMonth() + 1 !== currentMonth || nd.getFullYear() !== currentYear) {
                    // 跨月：切换月份视口后聚焦到目标日
                    currentYear = nd.getFullYear(); currentMonth = nd.getMonth() + 1;
                    renderYearDropdown();
                    reloadMonthView(function () {
                        focusCalendarCell();
                        if (currentNav === 'normal' && currentNormalTab === 'today') loadNormalTasks();
                    });
                } else {
                    selectDate(nds);
                    focusCalendarCell();
                }
            });

        /* ---------------- 关键字搜索（客户端，按当前年份范围） ---------------- */

        /* ---------------- 普通事务列表（滚动加载） ---------------- */
        async function loadNormalTasks() {
            resetSearchUI();
            var box = document.getElementById('normalTaskList');
            var ps = pageState[currentNormalTab];
            ps.page = 1;
            normalLoaded = [];
            normalHasMore = false;
            normalLoading = false;
            box.innerHTML = '<div class="loading-tip">加载中…</div>';
            var pagHost = document.getElementById('normalTaskPagination');
            if (pagHost) pagHost.innerHTML = '';
            await fetchNormalPage(true);
        }
        // 拉取一页普通事务；reset=true 为首次/换条件（重置累积），false 为上拉加载更多（追加）
        async function fetchNormalPage(reset) {
            if (normalLoading) return;
            normalLoading = true;
            if (!reset) {
                var s0 = document.getElementById('normalSentinel');
                if (s0) s0.textContent = '加载中…';
            }
            var ps = pageState[currentNormalTab];
            var url = '/api/tasks?page=' + ps.page + '&size=' + NORMAL_PAGE_SIZE;
            if (currentNormalTab === 'today') {
                url += '&date=' + selectedDate;
            } else {
                url += '&month=' + currentYear + '-' + pad2(currentMonth);
            }
            var r = await apiGet(url);
            normalLoading = false;
            if (!r || r.code !== 200) {
                if (reset) {
                    var errBox = document.getElementById('normalTaskList');
                    errBox.innerHTML = '';
                    errBox.appendChild(uiEmpty({ size: 'block', text: '加载失败，请刷新重试' }));
                }
                normalHasMore = false;
                return;
            }
            // 兼容两种返回：新契约 {list,total,hasMore} 或旧的裸数组
            var list, total = 0, hasMore = false;
            if (Array.isArray(r.data)) { list = r.data; total = list.length; hasMore = false; }
            else { list = r.data.list || []; total = r.data.total || list.length; hasMore = !!r.data.hasMore; }
            ps.total = total;
            normalHasMore = hasMore;
            if (reset) {
                // 首屏 / 切条件：全量重建
                normalLoaded = list;
                renderNormalList();
            } else {
                // 上拉加载：只把新页行数的行插到哨兵前，不重建已累积列表（FIX-32）
                normalLoaded = normalLoaded.concat(list);
                appendNormalRows(list);
            }
            setupNormalSentinel();
        }
        /* 从首页「今天要处理」跳转而来（/tasks?hl=<taskId>）：滚动定位并高亮该事务 */
        var hlTaskId = (function () { var m = (location.search || '').match(/[?&]hl=(\d+)/); return m ? parseInt(m[1], 10) : 0; })();
        function hlLocate() {
            if (!hlTaskId) return;

            el.classList.add('hl-flash');

                + '<button class="icon-btn" title="转为循环事务" aria-label="转为循环事务" onclick="toScheduled(' + t.id + ')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>'
                + '<button class="icon-btn" title="编辑" aria-label="编辑" onclick="editTask(' + t.id + ')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>'
                + '<button class="icon-btn danger" title="删除" aria-label="删除" onclick="removeTask(' + t.id + ')"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>'
                + '</div></div>';
        }
        function sentinelFoot() {
            return normalHasMore
                ? '↓ 上拉加载更多（已加载 ' + normalLoaded.length + ' 条）'
                : '— 已全部加载（共 ' + normalLoaded.length + ' 条）—';

        function renderNormalList() {
            var box = document.getElementById('normalTaskList');
            if (!normalLoaded.length) {
                box.innerHTML = '';
                box.appendChild(uiEmpty({
                    size: 'block', icon: EMPTY_ICO.clipboard,
                    text: currentNormalTab === 'today' ? '当天暂无事务，点击右上角「+ 添加事务」' : '当月暂无事务'
                }));

            box.innerHTML = normalLoaded.map(taskRowHtml).join('')
                + '<div id="normalSentinel" style="padding:12px;text-align:center;font-size:12.5px;color:var(--text-secondary);">' + sentinelFoot() + '</div>';

        // 上拉加载：仅把新页行片段插入哨兵前，避免每次翻页 map+重写全部已累积行（FIX-32）
        function appendNormalRows(list) {
            if (!list || !list.length) return;
            var box = document.getElementById('normalTaskList');
            var frag = document.createRange().createContextualFragment(list.map(taskRowHtml).join(''));
            var sentinel = document.getElementById('normalSentinel');
            if (sentinel && sentinel.parentNode === box) box.insertBefore(frag, sentinel);
            else box.appendChild(frag);

        // 哨兵进入视口即触发下一页（rootMargin 提前 300px 预加载）
        function setupNormalSentinel() {
            if (normalObserver) { try { normalObserver.disconnect(); } catch (e) { normalObserver = null; } }
            if (!normalHasMore || searchKw) return;
            var sentinel = document.getElementById('normalSentinel');
            if (!sentinel) return;
            if (!('IntersectionObserver' in window)) {
                window.addEventListener('scroll', onNormalScrollNearBottom, { passive: true });
                return;
            }
            normalObserver = new IntersectionObserver(function (entries) {
                entries.forEach(function (en) { if (en.isIntersecting) onNormalScrollNearBottom(); });
            }, { rootMargin: '300px' });
            normalObserver.observe(sentinel);
        }
        function onNormalScrollNearBottom() {
            if (currentNav !== 'normal' || searchKw) return;
            if (normalLoading || !normalHasMore) return;
            var ps = pageState[currentNormalTab];

            fetchNormalPage(false);

        /* ---------------- 置顶事务列表 ---------------- */
        async function loadPinnedTasks() {
            var box = document.getElementById('pinnedTaskList');
            var ps = pageState.pinned;
            box.innerHTML = '<div class="loading-tip">加载中…</div>';
            var r = await apiGet('/api/tasks?pinned=1&page=' + ps.page + '&pageSize=' + ps.size);
            if (r.code !== 200) {
                box.innerHTML = '';
                box.appendChild(uiEmpty({ size: 'block', text: '加载失败，请刷新重试' }));
                return;
            }
            var list = r.data, total = 0;
            if (Array.isArray(list)) {
                list = list.filter(t => t.pinned);

        function renderPagination(hostId, ps, total, onGo) {
            var host = document.getElementById(hostId);
            if (!host) return;
            var pages = Math.max(1, Math.ceil(total / ps.size));
            if (pages <= 1) { host.innerHTML = ''; return; }
            var h = '<div class="pagination">';
            h += '<button class="page-btn" ' + (ps.page <= 1 ? 'disabled' : '') + ' onclick="__goPage(' + (ps.page - 1) + ')">上一页</button>';
            var s = Math.max(1, ps.page - 2), e = Math.min(pages, s + 4);
            for (var i = s; i <= e; i++) {
                h += '<button class="page-btn' + (i === ps.page ? ' active' : '') + '" onclick="__goPage(' + i + ')">' + i + '</button>';
            }
            h += '<button class="page-btn" ' + (ps.page >= pages ? 'disabled' : '') + ' onclick="__goPage(' + (ps.page + 1) + ')">下一页</button>';
            h += '<span class="page-info">共 ' + total + ' 条 / ' + pages + ' 页</span></div>';
            host.innerHTML = h;
            window.__goPage = function (p) {
                if (p < 1 || p > pages) return;
                ps.page = p;
                onGo(p);
            };
        }

        /* ---------------- 统计 ---------------- */
        function statRange() {
            var y = currentYear, m = currentMonth;
            var pad = pad2;
            var start, end;
            // 统计锚点统一为日历视口：day/week 以「选中日期」为基准
            var anchor = selectedDate || todayStr();
            var base = new Date(anchor + 'T00:00:00');
            if (currentStatDim === 'day') {
                start = end = anchor;
            } else if (currentStatDim === 'week') {
                var wd = base.getDay() === 0 ? 7 : base.getDay();
                var mon = new Date(base.getTime() - (wd - 1) * 86400000);
                var sun = new Date(mon.getTime() + 6 * 86400000);
                start = mon.getFullYear() + '-' + pad(mon.getMonth() + 1) + '-' + pad(mon.getDate());
                end = sun.getFullYear() + '-' + pad(sun.getMonth() + 1) + '-' + pad(sun.getDate());
            } else if (currentStatDim === 'month') {
                start = y + '-' + pad(m) + '-01';
                end = y + '-' + pad(m) + '-' + new Date(y, m, 0).getDate();
            } else if (currentStatDim === 'quarter') {
                var q = Math.floor((m - 1) / 3);
                var sm = q * 3 + 1, em = sm + 2;
                start = y + '-' + pad(sm) + '-01';
                end = y + '-' + pad(em) + '-' + new Date(y, em, 0).getDate();
            } else {
                start = y + '-01-01';
                end = y + '-12-31';
            }
            return { start: start, end: end };
        }

        function statRangeText(rg) {
            if (currentStatDim === 'day') return rg.start;
            if (currentStatDim === 'week') return rg.start + ' ~ ' + rg.end;
            if (currentStatDim === 'month') return currentYear + ' 年 ' + currentMonth + ' 月';
            if (currentStatDim === 'quarter') return currentYear + ' 年 第 ' + (Math.floor((currentMonth - 1) / 3) + 1) + ' 季度';
            return currentYear + ' 年全年';
        }

            var pages = Math.max(1, Math.ceil(statTasks.length / statPageSize));

            var slice = statTasks.slice((statPage - 1) * statPageSize, statPage * statPageSize);
            box.innerHTML = '<div class="table-wrap"><table class="data-table"><thead><tr>'
                + '<th style="width:110px;">日期</th><th>事务名称</th><th style="width:90px;">时间</th>'

                + slice.map(t => '<tr>'

                    + '<td class="muted">' + escapeHtml(t.remark || '—') + '</td>'
                    + '</tr>').join('')
                + '</tbody></table></div>';
            var h = '<div class="pagination">';
            h += '<button class="page-btn" ' + (statPage <= 1 ? 'disabled' : '') + ' onclick="__statGo(' + (statPage - 1) + ')">上一页</button>';
            for (var i = 1; i <= pages; i++) {
                if (pages > 7 && i > 2 && i < pages - 1 && Math.abs(i - statPage) > 1) {
                    if (i === 3) h += '<span class="page-info">…</span>';
                    continue;
                }
                h += '<button class="page-btn' + (i === statPage ? ' active' : '') + '" onclick="__statGo(' + i + ')">' + i + '</button>';
            }
            h += '<button class="page-btn" ' + (statPage >= pages ? 'disabled' : '') + ' onclick="__statGo(' + (statPage + 1) + ')">下一页</button>';
            h += '<span class="page-info">共 ' + statTasks.length + ' 条</span></div>';
            host.innerHTML = h;
            window.__statGo = function (p) {
                if (p < 1 || p > pages) return;
                statPage = p; renderStatDetail();
            };
        }

        function downloadTaskTemplate() {
            var csv = '\uFEFF事务名称,日期(YYYY-MM-DD),提醒时间(HH:mm),状态,颜色,备注\n'
                + '示例：提交周报,' + todayStr() + ',09:00,待处理,#3b82f6,周五前完成\n'

        function handleTaskImportFile(file) {
            if (!file) return;
            document.getElementById('taskImportFileName').textContent = file.name;
            var reader = new FileReader();
            reader.onload = function (ev) {
                var text = String(ev.target.result || '');
                importParsedRows = parseImportText(text);
                var box = document.getElementById('taskImportResult');
                box.style.display = 'block';
                if (!importParsedRows.length) {
                    box.innerHTML = '<div class="import-tip error">未解析到有效数据，请检查文件（第一行为表头，第二行起为数据）</div>';
                    document.getElementById('taskImportStartBtn').disabled = true;
                    return;
                }
                var over = importParsedRows.length > 500;
                box.innerHTML = '<div class="import-tip">已解析 <strong>' + importParsedRows.length + '</strong> 条数据'
                    + (over ? '，超出单次上限 500 条，将只导入前 500 条' : '') + '</div>'
                    + '<table class="data-table" style="margin-top:10px;"><thead><tr><th>事务名称</th><th>日期</th><th>时间</th><th>状态</th></tr></thead><tbody>'
                    + importParsedRows.slice(0, 8).map(r => '<tr><td>' + escapeHtml(r.title) + '</td><td>' + r.date + '</td><td>' + (r.remindTime || '—') + '</td><td>' + escapeHtml(r.statusName || '') + '</td></tr>').join('')
                    + (importParsedRows.length > 8 ? '<tr><td colspan="4" class="muted">… 其余 ' + (importParsedRows.length - 8) + ' 条</td></tr>' : '')
                    + '</tbody></table>';
                document.getElementById('taskImportStartBtn').disabled = false;
            };
            reader.readAsText(file, 'UTF-8');
        }
        /** 解析 CSV / 制表符文本 */
        function parseImportText(text) {
            text = text.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
            var lines = text.split('\n').filter(l => l.trim() !== '');
            if (lines.length < 2) return [];
            var rows = [];
            for (var i = 1; i < lines.length; i++) {
                var cols = lines[i].split(/\t|,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(c => c.replace(/^"|"$/g, '').trim());
                var title = cols[0];
                if (!title) continue;
                var dateRaw = cols[1] || '';
                var date = normalizeDate(dateRaw);
                var time = (cols[2] || '').trim();
                var st = (cols[3] || '').trim();
                var color = (cols[4] || '').trim();
                var remark = (cols[5] || '').trim();
                var sid = statuses.find(s => s.name === st);
                rows.push({
                    title: title, date: date || selectedDate || todayStr(),
                    remindTime: /^\d{1,2}:\d{2}/.test(time) ? time : '',
                    statusId: sid ? sid.id : 1, statusName: st || statusName(1),
                    color: color, remark: remark
                });
                if (rows.length >= 500) break;
            }
            return rows;
        }
        function normalizeDate(s) {
            s = String(s || '').trim().replace(/[年月\/\.]/g, '-').replace(/日/g, '');
            var m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
            if (m) return m[1] + '-' + pad2(m[2]) + '-' + pad2(m[3]);
            var d = new Date(s);
            if (!isNaN(d.getTime())) return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
            return '';
        }
        async function startTaskImport() {
            if (!importParsedRows.length) return;
            var btn = document.getElementById('taskImportStartBtn');
            btn.disabled = true; btn.textContent = '导入中…';
            var okCount = 0, failCount = 0;
            for (var i = 0; i < importParsedRows.length; i++) {
                var r = await apiPost('/api/tasks', importParsedRows[i]);
                if (r.code === 200) okCount++; else failCount++;
            }
            btn.textContent = '开始导入';
            document.getElementById('taskImportResult').innerHTML =
                '<div class="import-tip"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg> 导入完成：成功 <strong>' + okCount + '</strong> 条'
                + (failCount ? '，失败 <strong>' + failCount + '</strong> 条' : '') + '</div>';
            showToast('导入完成：成功 ' + okCount + ' 条');
            setTimeout(function () {
                closeTaskImportModal();
                refreshMonth().then(renderCalendar);
                if (currentNav === 'normal') loadNormalTasks(); else if (currentNav === 'pinned') loadPinnedTasks();
            }, 900);
        }

        function escapeHtml(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        init();
    </script>
</body>
</html>
