<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模块管理 - 生活驾驶舱</title>
<link rel="stylesheet" href="/css/theme/01-base.css?v=1.48.54">
<link rel="stylesheet" href="/css/theme/02-late.css?v=1.48.54">


</head>
<body>
<div id="pageContent" class="page-container">
  <h1 style="margin:0 0 4px;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2h4v4h-1v1a2 2 0 1 1-2 0V6h-1z"/><path d="M14 6h4a2 2 0 0 1 2 2v3h-1a2 2 0 1 0 0 4h1v3a2 2 0 0 1-2 2h-3v-1a2 2 0 1 0-4 0v1H6a2 2 0 0 1-2-2v-3h1a2 2 0 1 0 0-4H4V8a2 2 0 0 1 2-2h4z"/></svg> 模块管理</h1>
  <p style="color:var(--text-secondary);font-size:13px;margin:0 0 20px;">启用/禁用功能模块，禁用后左侧菜单不再显示（数据保留，随时可重新启用）。<br>
    两种开关语义不同：<b>模块开关</b> = 导航入口显隐；<b>数据开关</b> = 隐藏该模块的数据并停止相关推送。原「系统设置 → 功能开关」已统一归拢到本页。</p>

  <div id="modStats" style="display:flex;gap:12px;margin-bottom:20px;"></div>
  <div id="modList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;"></div>
</div>

<div id="modConfigModal" class="modal-overlay" style="display:none;">
  <div class="modal" style="max-width:480px;">
    <div class="modal-header">
      <h3><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg> 模块设置 · <span id="mcName"></span></h3>
      <button class="modal-close" onclick="closeModConfig()">&times;</button>
    </div>
    <div class="modal-body">
      <div id="mcBody"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModConfig()">关闭</button>
      <button class="btn btn-primary" onclick="saveModConfig()">保存设置</button>
    </div>
  </div>
</div>

<script src="/js/common.js?v=1.48.54"></script>
<script src="/js/lunar.js?v=1.48.54"></script>
<script src="/js/voice.js?v=1.48.54"></script>
<script src="/js/pwa.js?v=1.48.54"></script>
<script src="/js/telemetry.js?v=1.48.54"></script>

<script>
renderShell('admin-modules', '模块管理');

const GROUP_LABEL = { '今天':'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/></svg> 今天', '家底':'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> 家底', '钱':'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg> 钱', '我':'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> 我' };

/* P2-5a：模块卡片上的「数据开关」= db.settings.featXxx（隐藏数据 + 停推送），
   与上方「模块开关」（导航入口显隐）是两套存储、两层语义，UI 归拢到本页但后端零改动。 */
const FEAT_OF_MODULE = {
  'gift-records': 'featGift', 'expiries': 'featExpiry', 'anniversaries': 'featAnniversary',
  'mortgage': 'featMortgage', 'vault': 'featVault', 'notes': 'featNotes', 'location': 'featTrack'
};
let FEAT_CFG = {};
async function loadFeatCfg() {
  const r = await apiGet('/api/settings/config');
  FEAT_CFG = (r && r.data) || {};
}
async function saveDataFlag(featKey, val) {
  const body = {}; body[featKey] = val;
  const r = await apiPut('/api/settings/config', body);
  if (r && r.code === 200) {
    FEAT_CFG[featKey] = val;
    localStorage.setItem('featureFlags', JSON.stringify(
      Object.assign(JSON.parse(localStorage.getItem('featureFlags') || '{}'), body)));
    applyFeatureFlags();            // 复用 common.js 的全局函数（含桌面 + 移动端口径）
    showToast('已保存', 'success');
  } else showToast((r && r.message) || '保存失败', 'error');
}

async function load() {
  await loadFeatCfg();              // 先取 featXxx 当前值，供卡片「数据开关」渲染
  const r = await apiGet('/api/modules');
  const mods = (r && r.data) || [];
  const enabled = mods.filter(m => m.status !== 'disabled').length;
  const disabled = mods.length - enabled;
  document.getElementById('modStats').innerHTML =
    '<div class="card" style="flex:1;padding:14px 18px;border-radius:12px;text-align:center;">'
    + '<div style="font-size:24px;font-weight:700;color:#10b981;">' + enabled + '</div>'
    + '<div style="font-size:12px;color:var(--text-secondary);">已启用</div></div>'
    + '<div class="card" style="flex:1;padding:14px 18px;border-radius:12px;text-align:center;">'
    + '<div style="font-size:24px;font-weight:700;color:#94a3b8;">' + disabled + '</div>'
    + '<div style="font-size:12px;color:var(--text-secondary);">已禁用</div></div>'
    + '<div class="card" style="flex:1;padding:14px 18px;border-radius:12px;text-align:center;">'
    + '<div style="font-size:24px;font-weight:700;color:var(--primary);">' + mods.length + '</div>'
    + '<div style="font-size:12px;color:var(--text-secondary);">总模块数</div></div>';
  // 按 group 分组
  const groups = {};
  mods.forEach(m => { (groups[m.group] = groups[m.group] || []).push(m); });
  let html = '';
  Object.keys(GROUP_LABEL).forEach(g => {
    if (!groups[g]) return;
    html += '<div style="grid-column:1/-1;margin-top:10px;font-weight:600;color:var(--text-secondary);font-size:14px;">' + GROUP_LABEL[g] + '</div>';
    groups[g].forEach(m => {
      const on = m.status !== 'disabled';
      const protected = ['dashboard', 'admin-modules'].includes(m.module_id);
      const href = '/' + m.module_id;
      html += '<div class="card" style="padding:16px;border-radius:12px;border:1px solid var(--border);">'
        + '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">'
        + '<div style="flex:1;">'
        + '<div style="font-weight:600;font-size:15px;">' + escapeHtml(m.name)
        + ' <span style="font-size:12px;color:var(--text-secondary);font-weight:400;">v' + m.version + '</span>'
        + (protected ? ' <span style="font-size:12px;background:#fee2e2;color:#dc2626;padding:2px 6px;border-radius:4px;">核心</span>' : '')
        + '</div>'
        + '<div style="font-size:12px;color:var(--text-secondary);margin-top:4px;line-height:1.5;">' + escapeHtml(m.desc) + '</div>'
        + '<a href="' + href + '" style="font-size:12px;color:var(--primary);display:inline-block;margin-top:8px;">打开页面 →</a>'
        + (FEAT_OF_MODULE[m.module_id]
            ? '<div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;">'
              + '<span style="font-size:12px;color:var(--text-secondary);">数据开关（隐藏数据 + 停推送'
              + (FEAT_OF_MODULE[m.module_id] === 'featTrack' ? '；同时隐藏「我的足迹」' : '') + '）</span>'
              + '<label class="switch"><input type="checkbox" '
              + (FEAT_CFG[FEAT_OF_MODULE[m.module_id]] !== false ? 'checked' : '')
              + ' onchange="saveDataFlag(\'' + FEAT_OF_MODULE[m.module_id] + '\', this.checked)"><span class="slider"></span></label>'
              + '</div>'
            : '')
        + '</div>'
        + '<div style="display:flex;flex-direction:column;align-items:center;gap:8px;flex-shrink:0;">'
        + '<button class="icon-btn" title="模块设置" aria-label="模块设置" onclick="openModConfig(\'' + m.module_id + '\',\'' + escapeHtml(m.name) + '\')" style="font-size:18px;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg></button>'
        + '<label class="switch" style="' + (protected ? 'opacity:.5;cursor:not-allowed;' : '') + '">'
        + '<input type="checkbox" ' + (on ? 'checked' : '') + ' ' + (protected ? 'disabled' : '') + ' onchange="toggleMod(\'' + m.module_id + '\', this)">'
        + '<span class="slider"></span></label>'
        + '</div>'
        + '</div></div>';
    });
  });
  document.getElementById('modList').innerHTML = html;
}

async function toggleMod(id, el) {
  const on = el.checked;
  const r = await apiPut('/api/modules', { module_id: id, status: on ? 'enabled' : 'disabled' });
  if (r && r.code === 200) {
    showToast(on ? '已启用' : '已禁用', 'success');
  } else {
    el.checked = !on;
    showToast((r && r.message) || '操作失败', 'error');
  }
}

/* ---- 模块设置弹窗 ---- */
// 各模块配置项定义（configFields），按 module_id 映射；未定义则显示提示
const MOD_FIELDS = {
  'scheduled-tasks': [{ k: 'defaultDays', t: 'number', label: '提前提醒天数', ph: '如 3' }],
  'expiries': [{ k: 'warnDays', t: 'number', label: '效期预警天数', ph: '如 30' }],
  'ledger': [{ k: 'defaultBook', t: 'text', label: '默认账本名称', ph: '日常账本' }],
  'pushDays': [],
  'vault': [{ k: 'maxWrong', t: 'number', label: '密码错误锁定次数', ph: '如 5' }]
};
let mcCurrent = null;
async function openModConfig(mid, name) {
  mcCurrent = mid;
  document.getElementById('mcName').textContent = name;
  const fields = MOD_FIELDS[mid];
  const r = await apiGet('/api/modules');
  const mod = (r && r.data || []).find(m => m.module_id === mid) || {};
  const cfg = mod.config || {};
  let html;
  if (fields && fields.length) {
    html = fields.map(f =>
      '<div class="form-group" style="margin-bottom:12px;">'
      + '<label style="font-size:13px;color:var(--text-secondary);margin-bottom:6px;display:block;">' + f.label + '</label>'
      + '<input class="form-input mc-input" data-k="' + f.k + '" type="' + (f.t === 'number' ? 'number' : 'text') + '"'
      + ' value="' + escapeHtml(cfg[f.k] != null ? cfg[f.k] : '') + '" placeholder="' + escapeHtml(f.ph || '') + '">'
      + '</div>').join('');
  } else {
    // 跳转页面自带设置
    const urlMap = { 'general-config': '/general-config', 'settings': '/settings', 'dashboard': '/general-config?feat=1' };
    const jump = urlMap[mid];
    html = '<div class="field-hint">该模块的设置集成在页面内。</div>'
      + (jump ? '<button class="btn btn-primary btn-sm" onclick="window.location.href=\'' + jump + '\'">前往设置页 →</button>' : '');
  }
  document.getElementById('mcBody').innerHTML = html;
  openModal('modConfigModal');
}
function closeModConfig() { closeModal('modConfigModal'); mcCurrent = null; }
async function saveModConfig() {
  if (!mcCurrent) return;
  const cfg = {};
  document.querySelectorAll('.mc-input').forEach(i => {
    const k = i.getAttribute('data-k');
    const v = i.value.trim();
    cfg[k] = i.type === 'number' ? (+v || 0) : v;
  });
  const r = await apiPut('/api/modules', { module_id: mcCurrent, config: cfg });
  if (r && r.code === 200) { showToast('设置已保存', 'success'); closeModConfig(); load(); }
  else showToast((r && r.message) || '保存失败', 'error');
}

load();
</script>
</body>
</html>
