<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>循环事务 - 生活驾驶舱</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%233b82f6'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>家</text></svg>">
    <link rel="stylesheet" href="/css/theme/01-base.css?v=1.48.54">
    <link rel="stylesheet" href="/css/theme/02-late.css?v=1.48.54">
    <link rel="stylesheet" href="/css/components.css?v=1.48.54">
    <style>
        /* FIX-33：操作行删除钮视觉降级——默认弱化，悬停/聚焦才恢复，降低误触 */
        .sched-row .icon-btn.danger { opacity: .5; }
        .sched-row .icon-btn.danger:hover, .sched-row .icon-btn.danger:focus { opacity: 1; }
        /* 本页移动端首屏压缩（≤768px）：避免底部固定 Tab 栏（高57px，覆盖 y787-844）遮挡列表首项操作行。
           选择器统一以 body[data-ai-page="scheduled-tasks"] 限定，仅本页生效，不影响桌面端与其他页面。 */
        @media (max-width: 768px) {
            body[data-ai-page="scheduled-tasks"] .file-stats { gap: 12px; margin-bottom: 12px; }
            body[data-ai-page="scheduled-tasks"] .file-stat { padding: 10px 12px; }
            body[data-ai-page="scheduled-tasks"] .cockpit-panel { padding: 12px; }
            body[data-ai-page="scheduled-tasks"] .cockpit-panel .panel-head { margin-bottom: 10px; }
            body[data-ai-page="scheduled-tasks"] .card { padding: 14px; }
            body[data-ai-page="scheduled-tasks"] .card-header { margin-bottom: 8px; }
            body[data-ai-page="scheduled-tasks"] .field-hint { line-height: 1.4; }
            body[data-ai-page="scheduled-tasks"] .sched-table tr { padding-top: 6px; }
        }
    </style>


</head>
<body>
    <div id="pageContent" style="display:none;">
        <div class="file-stats">
            <div class="file-stat"><div class="fs-value" id="cTotal">0</div><div class="fs-label">周期事项</div></div>
            <div class="file-stat"><div class="fs-value" id="cEnabled">0</div><div class="fs-label">已启用</div></div>
            <div class="file-stat"><div class="fs-value" id="cOverdue" style="color:var(--danger-text);">0</div><div class="fs-label">已逾期</div></div>
            <div class="file-stat"><div class="fs-value" id="cDueToday" style="color:var(--warning-text);">0</div><div class="fs-label">今日到期</div></div>
            <div class="file-stat"><div class="fs-value" id="cDueSoon" style="color:var(--primary);">0</div><div class="fs-label">未来 7 天</div></div>
            <div class="file-stat"><div class="fs-value" id="cDisabled" style="color:var(--text-secondary);">0</div><div class="fs-label">已停用</div></div>
        </div>

        <!-- 到期看板 -->
        <div class="cockpit-panel" style="margin-bottom:16px;">
            <div class="panel-head">
                <span class="title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> 最近需要处理（7 天内，含逾期）</span>
                <a href="#" onclick="openAddModal();return false;">+ 新建周期事项</a>
            </div>
            <div id="dueBoard"></div>
        </div>

        <div class="card">
            <div class="card-header">
                <span class="card-title">周期事项列表</span>
                <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                    <select id="filterCategory" onchange="loadList()" style="width:auto;">
                        <option value="">全部分类</option>
                    </select>
                    <button class="btn btn-primary btn-xs" onclick="openAddModal()">+ 添加周期事项</button>
                </div>
            </div>
            <p class="field-hint" style="margin-bottom:12px;">
                一套规则覆盖全家的周期性事务：换滤芯、空调清洗、全家体检、车辆年检、保单年检、证照续期……「每 N 天/周/月/年」按上次完成时间自动顺延，点「<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg> 完成」即排下一次。
            </p>
            <div id="taskListWrap"></div>
        </div>
    </div>

    <!-- 新增/编辑弹窗 -->
    <div id="stModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="stModalTitle">添加周期事项</h3>
                <button class="modal-close" onclick="closeModal('stModal')" aria-label="关闭">&times;</button>
            </div>
            <div class="form-group" id="templateGroup">
                <label>常用模板（一键填充）</label>
                <div class="chip-list" id="templateList"></div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>事项名称 *</label>
                    <div style="display:flex;gap:8px;align-items:center;">
                        <input type="text" id="sName" placeholder="如：净水器滤芯更换" autofocus style="flex:1;min-width:0;">
                        <script data-voice-mic data-target="sName"></script>
                    </div>
                </div>
                <div class="form-group">
                    <label>分类</label>
                    <select id="sCategory"></select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>重复方式</label>
                    <select id="sRuleType" onchange="renderRuleValue()">
                        <option value="interval">每隔 N 天/周/月/年（按上次完成顺延）</option>
                        <option value="daily">每天</option>
                        <option value="weekly">每周固定星期</option>
                        <option value="monthly">每月固定日期</option>
                        <option value="yearly">每年固定日期</option>
                    </select>
                </div>
                <div class="form-group" id="ruleValueGroup">
                    <label id="ruleValueLabel">间隔</label>
                    <div id="ruleValueHost"></div>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>提醒时间</label>
                    <input type="time" id="sRemindTime" value="09:00">
                </div>
                <div class="form-group" id="lastDoneGroup">
                    <label>上次完成日期</label>
                    <input type="date" id="sLastDone">
                    <div class="field-hint">填了按此日期顺延；留空则用下方「起算日」</div>
                </div>
            </div>
            <div class="form-group" id="startDateGroup" style="display:none;">
                <label>起算日 <span style="font-weight:400;color:var(--text-secondary);font-size:12px;">（可选）</span></label>
                <input type="date" id="sStartDate">
                <div class="field-hint">「上次完成」和「起算日」都留空时，事项会立刻标为今天到期。填了起算日则从那天起按间隔推进首个提醒日。</div>
            </div>
            <div class="form-group">
                <label>关联家人</label>
                <select id="sMember"><option value="">全家人共用</option></select>
            </div>
            <div class="form-group">
                <label>备注</label>
                <textarea id="sRemark" rows="2" placeholder="备注（可选）"></textarea>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('stModal')">取消</button>
                <button class="btn btn-primary" onclick="saveTask()">保存</button>
            </div>
        </div>
    </div>

    <script src="/js/common.js?v=1.48.54"></script>
    <script src="/js/lunar.js?v=1.48.54"></script>
    <script src="/js/voice.js?v=1.48.54"></script>
    <script src="/js/pwa.js?v=1.48.54"></script>
    <script src="/js/telemetry.js?v=1.48.54"></script>
    <script src="/js/ui.js?v=1.48.54"></script>
    <script>
        renderShell('scheduled-tasks', '循环事务');
        let editingId = null, members = [], tasks = [];

        /* 空态图标（可信内部 SVG，走 uiEmpty 的 icon 参数） */
        const EMPTY_ICO = {
            filter: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>',
            clock: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/><path d="M6.38 18.7 4 21"/><path d="M17.64 18.67 20 21"/></svg>'
        };

        const WEEK_NAMES = { 1: '周一', 2: '周二', 3: '周三', 4: '周四', 5: '周五', 6: '周六', 7: '周日' };
        const CATEGORIES = ['工作', '家电保养', '健康体检', '车辆年检', '保险保单', '证照续期', '家务清洁', '其他'];
        const UNIT_NAMES = { day: '天', week: '周', month: '个月', year: '年' };
        const TEMPLATES = [
            { name: '净水器滤芯更换', category: '家电保养', ruleType: 'interval', intervalValue: 3, intervalUnit: 'month' },
            { name: '空调滤网清洗', category: '家电保养', ruleType: 'interval', intervalValue: 6, intervalUnit: 'month' },
            { name: '全家体检', category: '健康体检', ruleType: 'interval', intervalValue: 12, intervalUnit: 'month' },
            { name: '车辆年检', category: '车辆年检', ruleType: 'interval', intervalValue: 12, intervalUnit: 'month' },
            { name: '保单年检', category: '保险保单', ruleType: 'interval', intervalValue: 12, intervalUnit: 'month' },
            { name: '更换牙刷', category: '家务清洁', ruleType: 'interval', intervalValue: 3, intervalUnit: 'month' }
        ];

        function escapeHtml(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function memberName(id) { const m = members.find(x => x.id === id); return m ? m.name : ''; }
        function memberAvatarFor(id) { const m = members.find(x => x.id === id); return (window.memberAvatarHtml && m) ? memberAvatarHtml(m) : ''; }
        function stateText(t) {
            if (!t.enabled) return { text: '已停用', cls: 'disabled' };
            // interval 尚未开始（notStarted）：置灰显示「未开始」，不按 daysLeft 标今天到期/逾期
            if (t.notStarted) return { text: '未开始', cls: 'disabled' };
            /* P1-2：从未完成且没设起算日 → 语义是「现在就该做」，而不是「今天又到期了」 */
            if (t.neverDone && t.daysLeft === 0) return { text: '首次待办', cls: 'due' };
            if (t.daysLeft < 0) return { text: '逾期 ' + (-t.daysLeft) + ' 天', cls: 'overdue' };
            if (t.daysLeft === 0) return { text: '今天该做', cls: 'due' };
            if (t.daysLeft <= 7) return { text: t.daysLeft + ' 天后', cls: 'soon' };
            return { text: t.daysLeft + ' 天后', cls: 'ok' };
        }
        // 每月 31 日被钳制到 28 日时的提示（clamped:true）
        function clampedNoteHtml(t) {
            return t.clamped ? '<div style="font-size:12px;color:var(--warning-text,#b45309);margin-top:2px;">（每月 31 日将自动钳制到 28 日）</div>' : '';
        }

        function initStatic() {
            document.getElementById('sCategory').innerHTML = CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('');
            document.getElementById('templateList').innerHTML = TEMPLATES.map((t, i) =>
                `<button type="button" class="chip" onclick="applyTemplate(${i})">＋ ${escapeHtml(t.name)}</button>`).join('');
        }
        function applyTemplate(i) {
            const t = TEMPLATES[i];
            document.getElementById('sName').value = t.name;
            document.getElementById('sCategory').value = t.category;
            document.getElementById('sRuleType').value = t.ruleType;
            renderRuleValue();
            if (t.intervalValue) document.getElementById('sIntervalValue').value = t.intervalValue;
            if (t.intervalUnit) document.getElementById('sIntervalUnit').value = t.intervalUnit;
            document.getElementById('sLastDone').value = '';
            showToast('已套用模板，可继续调整');
        }

        function renderRuleValue() {
            const type = document.getElementById('sRuleType').value;
            const host = document.getElementById('ruleValueHost');
            const group = document.getElementById('ruleValueGroup');
            const label = document.getElementById('ruleValueLabel');
            if (type === 'daily') { group.style.display = 'none'; host.innerHTML = ''; return; }
            group.style.display = 'block';
            document.getElementById('lastDoneGroup').style.display = (type === 'interval') ? 'block' : 'none';
            // P1-2：起算日只对 interval 有意义（首个提醒日 = 起算日 + 一个间隔）
            var sdGroup = document.getElementById('startDateGroup');
            if (sdGroup) sdGroup.style.display = (type === 'interval') ? 'block' : 'none';
            if (type === 'weekly') {
                label.textContent = '星期';
                host.innerHTML = '<select id="sRuleValue">' + Object.keys(WEEK_NAMES).map(k => `<option value="${k}">${WEEK_NAMES[k]}</option>`).join('') + '</select>';
            } else if (type === 'monthly') {
                label.textContent = '日期';
                host.innerHTML = '<select id="sRuleValue">' + Array.from({ length: 31 }, (_, i) => `<option value="${i + 1}">${i + 1} 号</option>`).join('') + '</select>'
                    + '<div style="font-size:12px;color:var(--text-secondary);width:100%;margin-top:4px;">支持 1–31 号；若当月无该日（如 2 月 30 号），则按当月最后一天执行。</div>';
            } else if (type === 'yearly') {
                label.textContent = '日期（每年）';
                host.innerHTML = '<div style="display:flex;gap:8px;">'
                    + '<select id="sRuleValueM">' + Array.from({ length: 12 }, (_, i) => `<option value="${String(i + 1).padStart(2, '0')}">${i + 1} 月</option>`).join('') + '</select>'
                    + '<select id="sRuleValueD">' + Array.from({ length: 31 }, (_, i) => `<option value="${String(i + 1).padStart(2, '0')}">${i + 1} 日</option>`).join('') + '</select>'
                    + '</div>';
            } else {
                label.textContent = '间隔';
                host.innerHTML = '<div style="display:flex;gap:8px;">'
                    + '<input type="number" id="sIntervalValue" min="1" value="3" style="width:90px;">'
                    + '<select id="sIntervalUnit">' + Object.keys(UNIT_NAMES).map(u => `<option value="${u}"${u === 'month' ? ' selected' : ''}>${UNIT_NAMES[u]}</option>`).join('') + '</select>'
                    + '</div>';
            }
        }
        function collectRule() {
            const type = document.getElementById('sRuleType').value;
            const out = { ruleType: type, ruleValue: '', intervalValue: 1, intervalUnit: 'month' };
            if (type === 'weekly' || type === 'monthly') {
                const el = document.getElementById('sRuleValue');
                out.ruleValue = el ? el.value : '1';
            } else if (type === 'yearly') {
                out.ruleValue = document.getElementById('sRuleValueM').value + '-' + document.getElementById('sRuleValueD').value;
            } else if (type === 'interval') {
                out.intervalValue = Math.max(1, +document.getElementById('sIntervalValue').value || 1);
                out.intervalUnit = document.getElementById('sIntervalUnit').value;
            }
            return out;
        }

        async function loadMembers() {
            const r = await apiGet('/api/family');
            members = (r.code === 200 && r.data) ? r.data : [];
            document.getElementById('sMember').innerHTML = '<option value="">全家人共用</option>' +
                members.map(m => `<option value="${m.id}">${escapeHtml(m.name)}</option>`).join('');
        }
        async function loadCounts() {
            const r = await apiGet('/api/scheduled-tasks/counts');
            if (r.code !== 200) return;
            document.getElementById('cTotal').textContent = r.data.total;
            document.getElementById('cEnabled').textContent = r.data.enabled;
            document.getElementById('cOverdue').textContent = r.data.overdue;
            document.getElementById('cDueToday').textContent = r.data.dueToday;
            document.getElementById('cDueSoon').textContent = r.data.dueSoon;
            document.getElementById('cDisabled').textContent = r.data.disabled;
        }
        async function loadDueBoard() {
            const r = await apiGet('/api/scheduled-tasks/due?days=7');
            const box = document.getElementById('dueBoard');
            const list = (r.code === 200 && r.data) ? r.data : [];
            if (!list.length) { box.innerHTML = '<div class="cockpit-empty">未来 7 天没有需要处理的周期事项 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.8 11.3 2 22l10.7-3.79"/><path d="M4 3h.01"/><path d="M22 8h.01"/><path d="M15 2h.01"/><path d="M22 20h.01"/><path d="m22 2-2.24.75a2.9 2.9 0 0 0-1.96 3.12c.1.86-.57 1.63-1.45 1.63h-.38c-.86 0-1.6.6-1.76 1.44L14 10"/><path d="m22 2-1.5 1.5"/></svg></div>'; return; }
            box.innerHTML = list.map(t => {
                const st = stateText(t);
                return `<div class="cockpit-item">
                    <span class="ci-icon">${t.daysLeft < 0 ? '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' : t.daysLeft === 0 ? '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/><path d="M6.38 18.7 4 21"/><path d="M17.64 18.67 20 21"/></svg>' : '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>'}</span>
                    <span class="ci-main">
                        <div class="ci-title">${escapeHtml(t.name)}${t.memberId ? ' · ' + (memberAvatarFor(t.memberId) || '') + ' ' + escapeHtml(memberName(t.memberId)) : ''}</div>
                        <div class="ci-sub">${escapeHtml(t.category || '其他')} · ${escapeHtml(t.ruleText || '')} · 上次完成 ${t.lastDoneAt || '未记录'}${t.clamped ? '（每月 31 日将自动钳制到 28 日）' : ''}</div>
                    </span>
                    <span class="ci-right" style="display:flex;gap:6px;align-items:center;"><button class="btn btn-secondary btn-xs" onclick="skipOnce(${t.id})" title="跳过这一次，顺延到下个周期">跳过</button><span class="sched-state ${st.cls}">${st.text}</span></span>
                    <button class="btn btn-secondary btn-xs" onclick="markDone(${t.id})"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg> 完成</button>
                </div>`;
            }).join('');
        }
        async function loadList() {
            const cat = document.getElementById('filterCategory').value;
            const r = await apiGet('/api/scheduled-tasks' + (cat ? '?category=' + encodeURIComponent(cat) : ''));
            const wrap = document.getElementById('taskListWrap');
            if (r.code !== 200) {
                wrap.innerHTML = '';
                wrap.appendChild(uiEmpty({ size: 'block', text: '加载失败，请刷新重试' }));
                return;
            }
            tasks = r.data || [];
            if (!tasks.length) {
                /* 空态与真实数据状态一致：筛选态 ≠ 全局无数据，避免误导（项目惯例） */
                wrap.innerHTML = '';
                if (cat) {
                    wrap.appendChild(uiEmpty({
                        size: 'block', icon: EMPTY_ICO.filter,
                        title: '「' + cat + '」分类下暂无周期事项',
                        text: '其它分类可能还有事项，清除筛选即可查看全部',
                        action: {
                            text: '清除筛选', kind: 'ghost',
                            onClick: function () { document.getElementById('filterCategory').value = ''; loadList(); }
                        }
                    }));
                    return;
                }
                wrap.appendChild(uiEmpty({
                    size: 'block', icon: EMPTY_ICO.clock,
                    title: '还没有周期事项',
                    text: '从模板一键创建：滤芯、体检、年检、保单年检都能自动排期',
                    action: { text: '添加第一个周期事项', onClick: function () { openAddModal(); } }
                }));
                return;
            }
            wrap.innerHTML = '<div class="table-wrap"><table class="data-table sched-table"><thead><tr>'
                + '<th>事项</th><th>分类</th><th>重复规则</th><th>提醒时间</th><th>上次完成</th><th>下次执行</th><th>状态</th><th style="width:170px;">操作</th>'
                + '</tr></thead><tbody>' + tasks.map(t => {
                    const st = stateText(t);
                    return `<tr class="sched-row" data-id="${t.id}"${t.notStarted ? ' style="opacity:.55;"' : ''}>
                        <td style="font-weight:500;" data-label="事项">${escapeHtml(t.name)}${t.memberId ? `<div style="font-size:12px;color:var(--text-secondary);">${memberAvatarFor(t.memberId) || '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'} ${escapeHtml(memberName(t.memberId))}</div>` : ''}${t.remark ? `<div style="font-size:12px;color:var(--text-secondary);">${escapeHtml(t.remark)}</div>` : ''}</td>
                        <td data-label="分类"><span class="cat-badge">${escapeHtml(t.category || '其他')}</span></td>
                        <td data-label="重复规则">${escapeHtml(t.ruleText || '')}${clampedNoteHtml(t)}</td>
                        <td data-label="提醒时间"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/><path d="M6.38 18.7 4 21"/><path d="M17.64 18.67 20 21"/></svg> ${t.remindTime}</td>
                        <td data-label="上次完成" style="font-size:13px;color:var(--text-secondary);">${t.lastDoneAt || '—'}${t.doneCount ? `<div style="font-size:12px;">已完成 ${t.doneCount} 次</div>` : ''}</td>
                        <td data-label="下次执行" style="font-size:13px;">${t.nextRunDate || '—'}</td>
                        <td data-label="状态"><span class="sched-state ${st.cls}">${st.text}</span></td>
                        <td data-label="操作">
                            <button class="icon-btn" title="转为一次性事务" aria-label="转为一次性事务" onclick="toOnce(${t.id})"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
                            <button class="icon-btn" title="标记完成" aria-label="标记完成" onclick="markDone(${t.id})"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg></button>
                            <button class="icon-btn" title="跳过一次（顺延到下个周期，不计完成次数）" aria-label="跳过一次" onclick="skipOnce(${t.id})"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg></button>
                            <button class="icon-btn" title="${t.enabled ? '停用' : '启用'}" aria-label="${t.enabled ? '停用' : '启用'}" onclick="toggleEnabled(${t.id}, ${t.enabled ? 0 : 1})">${t.enabled ? '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>' : '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>'}</button>
                            <button class="icon-btn" title="编辑" aria-label="编辑" onclick="editTask(${t.id})"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
                            <button class="icon-btn danger" title="删除" aria-label="删除" onclick="removeTask(${t.id})"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>
                        </td>
                    </tr>`;
                }).join('') + '</tbody></table></div>';
            hlLocate();
        }
        function loadAll() { loadCounts(); loadDueBoard(); loadList(); }

        /* 从首页跳转 ?hl=<id>：滚动定位并高亮 */
        function hlLocate() {
            var m = (location.search || '').match(/[?&]hl=(\d+)/);
            if (!m) return;
            var el = document.querySelector('.sched-row[data-id="' + m[1] + '"]');
            if (!el) return;
            try { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch (e) { el.scrollIntoView(true); }
            el.style.animation = 'taskHl 2.4s ease';
            el.style.boxShadow = '0 0 0 2px var(--primary)';
            setTimeout(function () { el.style.boxShadow = ''; el.style.animation = ''; }, 2600);
        }

        function openAddModal() {
            editingId = null;
            document.getElementById('stModalTitle').textContent = '添加周期事项';
            document.getElementById('sName').value = '';
            document.getElementById('sCategory').value = '家电保养';
            document.getElementById('sRuleType').value = 'interval';
            document.getElementById('sRemindTime').value = '09:00';
            document.getElementById('sLastDone').value = '';
            document.getElementById('sStartDate').value = '';
            document.getElementById('sMember').value = '';
            document.getElementById('sRemark').value = '';
            document.getElementById('templateGroup').style.display = 'block';
            renderRuleValue();
            openModal('stModal');
        }
        function editTask(id) {
            const t = tasks.find(x => x.id === id);
            if (!t) return;
            editingId = id;
            document.getElementById('stModalTitle').textContent = '编辑周期事项';
            document.getElementById('templateGroup').style.display = 'none';
            document.getElementById('sName').value = t.name;
            document.getElementById('sCategory').value = t.category || '其他';
            document.getElementById('sRuleType').value = t.ruleType;
            renderRuleValue();
            if (t.ruleType === 'weekly' || t.ruleType === 'monthly') {
                const el = document.getElementById('sRuleValue');
                if (el) el.value = t.ruleValue || '1';
            } else if (t.ruleType === 'yearly') {
                const parts = (t.ruleValue || '01-01').split('-');
                document.getElementById('sRuleValueM').value = parts[0] || '01';
                document.getElementById('sRuleValueD').value = parts[1] || '01';
            } else if (t.ruleType === 'interval') {
                document.getElementById('sIntervalValue').value = t.intervalValue || 1;
                document.getElementById('sIntervalUnit').value = t.intervalUnit || 'month';
            }
            document.getElementById('sRemindTime').value = t.remindTime || '09:00';
            document.getElementById('sLastDone').value = t.lastDoneAt || '';
            document.getElementById('sStartDate').value = t.startDate || '';
            document.getElementById('sMember').value = t.memberId || '';
            document.getElementById('sRemark').value = t.remark || '';
            openModal('stModal');
        }
        async function saveTask() {
            const nameEl = document.getElementById('sName');
            const data = Object.assign({
                name: nameEl.value.trim(),
                category: document.getElementById('sCategory').value,
                remindTime: document.getElementById('sRemindTime').value || '09:00',
                lastDoneAt: document.getElementById('sLastDone').value,
                startDate: document.getElementById('sStartDate').value,
                memberId: document.getElementById('sMember').value || null,
                remark: document.getElementById('sRemark').value
            }, collectRule());
            if (!validateField(nameEl, { required: true, emptyMsg: '请填写事项名称' })) return;
            if (!data.name) return;
            const r = editingId ? await apiPut('/api/scheduled-tasks/' + editingId, data) : await apiPost('/api/scheduled-tasks', data);
            if (r.code === 200) { showToast('保存成功：下次 ' + (r.data.nextRunDate || '')); closeModal('stModal'); loadAll(); }
            else showToast(r.message || '保存失败', 'error');
        }
        async function markDone(id) {
            const t = tasks.find(x => x.id === id);
            const okGo = await confirmModal({
                title: '标记完成',
                message: '确认「' + (t ? t.name : '') + '」本次已完成？系统会按规则自动排下一次。',
                confirmText: '确认完成',
                danger: false
            });
            if (!okGo) return;
            const r = await apiPost('/api/scheduled-tasks/' + id + '/done', {});
            if (r.code === 200) { showToast(r.message); loadAll(); }
            else showToast(r.message || '操作失败', 'error');
        }
        async function skipOnce(id) {
            const t = tasks.find(x => x.id === id);
            const okGo = await confirmModal({
                title: '跳过一次',
                message: '确认跳过「' + (t ? t.name : '') + '」这一次？不计入完成次数，提醒顺延到下一个周期。',
                confirmText: '跳过',
                danger: false
            });
            if (!okGo) return;
            const r = await apiPost('/api/scheduled-tasks/' + id + '/skip', {});
            if (r.code === 200) { showToast(r.message); loadAll(); }
            else showToast(r.message || '操作失败', 'error');
        }
        async function toggleEnabled(id, enabled) {
            const r = await apiPut('/api/scheduled-tasks/' + id, { enabled: !!enabled });
            if (r.code === 200) { showToast(enabled ? '已启用' : '已停用'); loadAll(); }
        }
        async function removeTask(id) {
            const t = tasks.find(x => x.id === id);
            if (!(await confirmDel('确定删除「' + (t ? t.name : '') + '」吗？'))) return;
            const r = await apiDelete('/api/scheduled-tasks/' + id);
            if (r.code === 200) { showToast('删除成功'); loadAll(); }
        }

        initStatic();
        /* 转为一次性事务：跳转 tasks 页并带入信息 */
        function toOnce(id) {
            const t = tasks.find(x => x.id === id);
            if (!t) return;
            showToast('正在打开一次性事务表单…');
            setTimeout(function () { location.href = '/tasks?fromScheduled=' + id; }, 350);
        }
        /* 一次性事务 → 循环事务：从 tasks 页跳入，预填表单 */
        (function () {
            const m = (location.search || '').match(/[?&]fromTask=(\d+)/);
            if (!m) return;
            apiGet('/api/tasks/' + parseInt(m[1], 10)).then(function (r) {
                if (r.code !== 200 || !r.data) return;
                const t = r.data;
                openAddModal();
                document.getElementById('sName').value = t.title || '';
                document.getElementById('sStartDate').value = t.date || '';
                document.getElementById('sMember').value = t.memberId ? String(t.memberId) : '';
                document.getElementById('sRemark').value = (t.remark || '').slice(0, 500);
                showToast('已带入一次性事务「' + (t.title || '') + '」，选择周期后保存');
            });
        })();
        document.getElementById('filterCategory').innerHTML = '<option value="">全部分类</option>' +
            CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('');
        loadMembers().then(loadAll);
    </script>
</body>
</html>
