<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>保险库 - 生活驾驶舱</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%233b82f6'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>家</text></svg>">
    <link rel="stylesheet" href="/css/theme/01-base.css?v=1.48.54">
    <link rel="stylesheet" href="/css/theme/02-late.css?v=1.48.54">
    <link rel="stylesheet" href="/css/components.css?v=1.48.54">


<style>
/* === v54·B3 收敛：公共交互增强已并入 theme/，此处仅保留本页专属规则 === */
/* FIX：深色模式下解锁框补充边框与阴影，避免与背景融合（页面级覆盖，不改公共文件） */
[data-theme="dark"] #lockView .card { border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,.35); }
/* 深色模式空态文案：曾在此按 .empty-state 覆盖成 #f1f5f9 / #cbd5e1。
   v1.48.39 空态改用 .c-empty-block 后选择器已失效，且不再需要——
   该组件走 --text-primary(#e2e8f0) / --text-secondary(#94a3b8) 压 --card-bg(#1e293b)，
   实算 11.8 / 5.8，本就过 AA。删掉而不是改选择器：多一层页面级覆盖，
   下一次改令牌就多一处不会跟着动的地方。 */
</style>

</head>
<body>
    <div id="pageContent" style="display:none;">
        <!-- 锁定/设置主密码 -->
        <div id="lockView" style="max-width:420px;margin:60px auto;">
            <div class="card" style="text-align:center;">
                <div style="font-size:52px;margin-bottom:12px;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg></div>
                <h3 style="margin-bottom:8px;" id="lockTitle">保险库已锁定</h3>
                <p style="font-size:13px;color:var(--text-secondary);margin-bottom:20px;" id="lockDesc">输入主密码解锁查看已保存的密码与证件信息</p>
                <div class="form-group">
                    <input type="password" id="masterInput" placeholder="请输入主密码" style="text-align:center;font-size:15px;"
                        autocomplete="current-password" onkeydown="if(event.key==='Enter')unlock()">
                </div>
                <div class="form-group" id="confirmGroup" style="display:none;">
                    <input type="password" id="masterInput2" placeholder="请再次输入主密码确认" style="text-align:center;font-size:15px;"
                        autocomplete="new-password" onkeydown="if(event.key==='Enter')unlock()">
                </div>
                <div id="strengthBar" style="display:none;text-align:left;margin:-6px 0 4px;">
                    <div style="height:6px;border-radius:3px;background:var(--bg-inset, #eef1f6);overflow:hidden;">
                        <div id="strengthFill" style="height:100%;width:0;border-radius:3px;transition:width .25s,background .25s;background:#e11d48;"></div>
                    </div>
                    <div style="font-size:12px;color:var(--text-secondary);margin-top:4px;" id="strengthText"></div>
                </div>
                <p id="noRecoverWarn" style="display:none;font-size:12px;color:#dc2626;background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.25);border-radius:8px;padding:8px 10px;margin:0 0 12px;text-align:left;">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> 主密码<b>无法找回</b>：密钥由主密码派生，服务器不存储明文。一旦遗忘，已保存的密码/证件/卡号将<b>永久无法解密</b>，请务必牢记或离线妥善保管。
                </p>
                <button class="btn btn-primary" style="width:100%;" onclick="unlock()" id="unlockBtn">解锁</button>
                <p style="font-size:12px;color:var(--text-secondary);margin-top:14px;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> 条目使用 AES 加密存储；主密码经 PBKDF2（12 万次迭代）派生校验，服务器不存储明文主密码与明文密钥</p>
            </div>
        </div>

        <!-- 已解锁 -->
        <div id="vaultView" style="display:none;">
            <div class="file-stats">
                <div class="file-stat"><div class="fs-value" id="vTotal">0</div><div class="fs-label">条目总数</div></div>
                <div class="file-stat"><div class="fs-value" id="vPassword">0</div><div class="fs-label">账号密码</div></div>
                <div class="file-stat"><div class="fs-value" id="vCard">0</div><div class="fs-label">证件 / 保单 / 卡号</div></div>
                <div class="file-stat"><div class="fs-value" id="vExpiring" style="color:var(--warning-text);">0</div><div class="fs-label">30 天内到期</div></div>
            </div>

            <div id="expiringBox" class="cockpit-panel" style="margin-bottom:16px;display:none;">
                <div class="panel-head"><span class="title">⏳ 有效期临近</span><span style="font-size:12px;color:var(--text-secondary);">证件 / 保单 / 卡有效期</span></div>
                <div id="expiringList"></div>
            </div>

            <div class="card-header" style="margin-bottom:14px;">
                <span class="card-title" style="font-size:16px;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg> 保险库 <span style="font-size:12px;color:var(--text-secondary);" id="vaultCount"></span></span>
                <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                    <div class="mini-tabs" id="kindTabs" style="flex-wrap:wrap;"></div>
                    <button class="btn btn-primary btn-xs" onclick="openEntryModal()">+ 添加条目</button>
                    <button class="btn btn-secondary btn-xs" onclick="relock()">锁定</button>
                </div>
            </div>
            <input type="text" id="vaultSearch" placeholder="搜索标题、持有人、用户名…" style="width:100%;padding:10px 14px;border:1px solid var(--border-color);border-radius:var(--radius);background:var(--input-bg);color:var(--text-primary);outline:none;margin-bottom:14px;" oninput="renderEntries()">
            <div style="font-size:12px;color:var(--text-secondary);margin:-6px 0 12px;display:flex;align-items:center;gap:6px;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> 条目经 AES 加密存储，仅本机可解密</div>
            <div id="entryList"></div>
        </div>
    </div>

    <!-- 条目弹窗 -->
    <div id="entryModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="entryModalTitle">添加条目</h3>
                <button class="modal-close" onclick="closeModal('entryModal')">&times;</button>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>类型</label>
                    <select id="vKind" onchange="renderKindFields()"></select>
                </div>
                <div class="form-group">
                    <label>标题 *</label>
                    <input type="text" id="vTitle" placeholder="如：房产证 / 重疾险保单" autofocus>
                </div>
            </div>
            <div class="form-group" id="holderGroup">
                <label>持有人</label>
                <input type="text" id="vHolder" placeholder="如：本人 / 配偶">
            </div>
            <div class="form-group" id="usernameGroup">
                <label>用户名</label>
                <input type="text" id="vUsername" placeholder="登录用户名/手机号">
            </div>
            <div class="form-group">
                <label id="secretLabel">密码 *</label>
                <div style="display:flex;gap:8px;">
                    <input type="password" id="vSecret" style="flex:1;" placeholder="密码 / 证件号 / 卡号">
                    <button class="icon-btn" style="height:auto;" title="显示/隐藏" onclick="togglePwdInput()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    <button class="icon-btn" style="height:auto;" title="随机生成密码" onclick="genPwd()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1"/><circle cx="16" cy="16" r="1"/><circle cx="12" cy="12" r="1"/></svg></button>
                </div>
                <div class="field-hint" id="secretHint"></div>
            </div>
            <div class="form-group" id="expireGroup">
                <label>有效期至</label>
                <input type="date" id="vExpire">
                <div class="field-hint">证件到期、保单续费日等，临近时会在生活驾驶舱提醒</div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>关联家人</label>
                    <select id="vMember"><option value="">不关联</option></select>
                </div>
                <div class="form-group">
                    <label>网址 / 备注位置</label>
                    <input type="text" id="vUrl" placeholder="https://（可选）">
                </div>
            </div>
            <div class="form-group">
                <label>备注</label>
                <textarea id="vRemark" rows="2" placeholder="备注（可选）"></textarea>
            </div>
            <div style="font-size:12px;color:var(--text-secondary);margin:0 0 12px;display:flex;align-items:center;gap:6px;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> 条目经 AES 加密存储，仅本机可解密</div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('entryModal')">取消</button>
                <button class="btn btn-primary" onclick="saveEntry()">保存</button>
            </div>
        </div>
    </div>

    <script src="/js/common.js?v=1.48.54"></script>
    <script src="/js/lunar.js?v=1.48.54"></script>
    <script src="/js/voice.js?v=1.48.54"></script>
    <script src="/js/pwa.js?v=1.48.54"></script>
    <script src="/js/telemetry.js?v=1.48.54"></script>
    <script src="/js/ui.js?v=1.48.54"></script>
    <script>
        renderShell('vault', '保险库');
        let entries = [], members = [], editingId = null, unlocked = false, kindFilter = '';

        const KINDS = {
            password: { name: '账号密码', icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>', secretLabel: '密码', hasUser: true, hasExpire: false, needsSecret: true },
            idcard: { name: '证件', icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><circle cx="8" cy="9" r="2"/><path d="M6 14s1-2 2-2 2 2 2 2"/></svg>', secretLabel: '证件号码', hasUser: false, hasExpire: true, needsSecret: true },
            policy: { name: '保单', icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>', secretLabel: '保单号', hasUser: false, hasExpire: true, needsSecret: true },
            membership: { name: '会员卡', icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>', secretLabel: '卡号', hasUser: false, hasExpire: true, needsSecret: true },
            bankcard: { name: '银行卡', icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="22" x2="21" y2="22"/><line x1="6" y1="18" x2="6" y2="11"/><line x1="10" y1="18" x2="10" y2="11"/><line x1="14" y1="18" x2="14" y2="11"/><line x1="18" y1="18" x2="18" y2="11"/><polygon points="12 2 20 7 4 7"/></svg>', secretLabel: '卡号', hasUser: false, hasExpire: true, needsSecret: true },
            other: { name: '其他', icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>', secretLabel: '编号', hasUser: false, hasExpire: true, needsSecret: true }
        };

        /* 空态图标（可信内部 SVG）。能复用 KINDS 里已有的就复用，同一图形不抄两份 */
        const EMPTY_ICO = {
            search: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
            folder: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>'
        };

        function escapeHtml(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        /* URL 白名单：仅放行 http(s)，拦截 javascript: 等伪协议 */
        function safeHttpUrl(u) {
            const s = String(u || '').trim();
            return /^https?:\/\//i.test(s) ? s : '';
        }
        /* 老数据兼容：早期条目用 doc/card 等旧 kind，新 KINDS 里没有，否则会全部回退成「账号密码」 */
        const LEGACY_KIND = { doc: 'idcard', certificate: 'idcard', card: 'bankcard', bank: 'bankcard' };
        function kindKey(e) {
            const k = e.kind || 'password';
            if (KINDS[k]) return k;
            return LEGACY_KIND[k] || 'password';
        }
        function kindOf(e) { return KINDS[kindKey(e)] || KINDS.password; }
        function entryValue(e) { return e.password || e.secret || ''; }
        function memberName(id) { const m = members.find(x => x.id === id); return m ? m.name : ''; }
        function memberAvatarFor(id) { const m = members.find(x => x.id === id); return (window.memberAvatarHtml && m) ? memberAvatarHtml(m) : ''; }

        async function init() {
            const r = await apiGet('/api/vault/status');
            if (r.code === 200 && !r.data.masterSet) {
                setupMode = true;
                document.getElementById('lockTitle').textContent = '设置主密码';
                document.getElementById('lockDesc').textContent = '首次使用，请设置一个主密码来保护保险库';
                document.getElementById('unlockBtn').textContent = '设置并解锁';
                document.getElementById('confirmGroup').style.display = 'block';
                document.getElementById('noRecoverWarn').style.display = 'block';
                document.getElementById('strengthBar').style.display = 'block';
                document.getElementById('masterInput').setAttribute('autocomplete', 'new-password');
            }
            document.getElementById('kindTabs').innerHTML = '<button type="button" class="active" data-k="" onclick="setKind(\'\')">全部</button>'
                + Object.keys(KINDS).map(k => `<button type="button" data-k="${k}" onclick="setKind('${k}')">${KINDS[k].icon} ${KINDS[k].name}</button>`).join('');
        }
        /* 成员列表仅解锁后编辑弹窗才需要，避免锁定态白拉 /api/family；relock 后保留复用 */
        async function loadMembers() {
            if (members.length) return;
            const f = await apiGet('/api/family');
            members = (f.code === 200 && f.data) ? f.data : [];
            document.getElementById('vMember').innerHTML = '<option value="">不关联</option>' +
                members.map(m => `<option value="${m.id}">${escapeHtml(m.name)}</option>`).join('');
        }
        let setupMode = false;
        function masterStrength(pw) {
            let score = 0;
            if (pw.length >= 6) score++;
            if (pw.length >= 10) score++;
            if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) score++;
            if (/\d/.test(pw)) score++;
            if (/[^a-zA-Z0-9]/.test(pw)) score++;
            return score; // 0-5
        }
        document.getElementById('masterInput').addEventListener('input', function () {
            if (!setupMode) return;
            const pw = this.value, s = masterStrength(pw);
            const fill = document.getElementById('strengthFill'), txt = document.getElementById('strengthText');
            const pct = [0, 20, 40, 60, 80, 100][s], labels = ['过短', '弱', '一般', '良好', '强', '极强'];
            const colors = ['#e11d48', '#e11d48', '#f59e0b', '#f59e0b', '#16a34a', '#16a34a'];
            fill.style.width = pct + '%'; fill.style.background = colors[s];
            txt.textContent = pw ? '密码强度：' + labels[s] + (s <= 2 ? '，建议混合大小写字母、数字与符号' : '') : '';
        });
        async function unlock() {
            const pwd = document.getElementById('masterInput').value;
            if (!pwd) return showToast('请输入主密码', 'warning');
            if (setupMode) {
                if (pwd.length < 6) return showToast('主密码至少 6 位，建议 8 位以上并混合字符类型', 'warning');
                const pwd2 = document.getElementById('masterInput2').value;
                if (pwd !== pwd2) return showToast('两次输入的主密码不一致', 'error');
                // 纯 6 位数字弱密码 → 二次确认才提交
                if (/^\d{6}$/.test(pwd)) {
                    const sure = await confirmModal({
                        title: '弱密码提示',
                        message: '该密码过于简单，确认使用吗？',
                        confirmText: '仍要使用',
                        cancelText: '重新输入',
                        danger: false
                    });
                    if (!sure) return;
                }
            }
            const r = await apiPost('/api/vault/master', { masterPassword: pwd });
            if (r.code === 200) {
                unlocked = true;
                showToast(r.message);
                document.getElementById('lockView').style.display = 'none';
                document.getElementById('vaultView').style.display = 'block';
                loadEntries();
                loadMembers();
                armIdleTimer();
            } else showToast(r.message || '主密码错误', 'error');
        }
        async function relock() {
            unlocked = false;
            clearIdleTimer();
            try { await apiPost('/api/vault/lock', {}); } catch (e) { }
            setupMode = false;
            document.getElementById('masterInput').value = '';
            document.getElementById('masterInput2').value = '';
            document.getElementById('vaultView').style.display = 'none';
            document.getElementById('lockView').style.display = 'block';
            document.getElementById('lockTitle').textContent = '保险库已锁定';
            document.getElementById('lockDesc').textContent = '输入主密码解锁查看已保存的密码与证件信息';
            document.getElementById('unlockBtn').textContent = '解锁';
            document.getElementById('confirmGroup').style.display = 'none';
            document.getElementById('noRecoverWarn').style.display = 'none';
            document.getElementById('strengthBar').style.display = 'none';
            entries = [];
        }
        /* ---------------- 空闲 5 分钟自动锁 ---------------- */
        const IDLE_LIMIT = 5 * 60 * 1000;
        let idleTimer = null;
        function clearIdleTimer() { if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; } }
        function resetIdleTimer() {
            if (!unlocked) return;
            clearIdleTimer();
            idleTimer = setTimeout(autoLock, IDLE_LIMIT);
        }
        function armIdleTimer() {
            ['click', 'keydown', 'mousemove', 'scroll', 'touchstart', 'input'].forEach(ev =>
                document.addEventListener(ev, resetIdleTimer, { passive: true }));
            resetIdleTimer();
        }
        async function autoLock() {
            if (!unlocked) return;
            // 弹窗打开时不打断正在进行的编辑：推迟，等下次活动重置
            if (document.querySelector('.modal-overlay.open')) { resetIdleTimer(); return; }
            showToast('已空闲 5 分钟，保险库自动锁定', 'warning');
            await relock();
        }
        function setKind(k) {
            kindFilter = k;
            document.querySelectorAll('#kindTabs button').forEach(b => b.classList.toggle('active', b.dataset.k === k));
            renderEntries();
        }

        async function loadEntries() {
            const [r, ex] = await Promise.all([apiGet('/api/vault/entries'), apiGet('/api/vault/expiring?days=30')]);
            if (r.code === 200) { entries = r.data || []; renderEntries(); renderStats(); }
            if (ex.code === 200) renderExpiring(ex.data || []);
        }
        function renderStats() {
            document.getElementById('vTotal').textContent = entries.length;
            document.getElementById('vPassword').textContent = entries.filter(e => (e.kind || 'password') === 'password').length;
            document.getElementById('vCard').textContent = entries.filter(e => (e.kind || 'password') !== 'password').length;
            document.getElementById('vExpiring').textContent = entries.filter(e => {
                if (!e.expireDate) return false;
                const left = daysBetween(todayStr(), e.expireDate);
                return left >= 0 && left <= 30;
            }).length;
        }
        function renderExpiring(list) {
            const box = document.getElementById('expiringBox');
            if (!list.length) { box.style.display = 'none'; return; }
            box.style.display = 'block';
            document.getElementById('expiringList').innerHTML = list.map(e => {
                const k = kindOf(e);
                const cls = e.left < 0 ? 'overdue' : (e.left <= 30 ? 'due' : 'soon');
                const txt = e.left < 0 ? '已过期 ' + (-e.left) + ' 天' : (e.left === 0 ? '今天到期' : e.left + ' 天后到期');
                return `<div class="cockpit-item">
                    <span class="ci-icon">${k.icon}</span>
                    <span class="ci-main"><div class="ci-title">${escapeHtml(e.title)}</div>
                    <div class="ci-sub">${k.name}${e.holder ? ' · ' + escapeHtml(e.holder) : ''} · 有效期至 ${e.expireDate}</div></span>
                    <span class="ci-right"><span class="sched-state ${cls}">${txt}</span></span>
                </div>`;
            }).join('');
        }
        function renderEntries() {
            const kw = document.getElementById('vaultSearch').value.trim().toLowerCase();
            const box = document.getElementById('entryList');
            const list = entries.filter(e => {
                if (kindFilter && kindKey(e) !== kindFilter) return false;
                if (!kw) return true;
                return (e.title || '').toLowerCase().includes(kw) || (e.username || '').toLowerCase().includes(kw)
                    || (e.holder || '').toLowerCase().includes(kw);
            });
            document.getElementById('vaultCount').textContent = '共 ' + entries.length + ' 条';
            if (!list.length) {
                box.innerHTML = '';
                if (kw) {
                    box.appendChild(uiEmpty({
                        size: 'block', icon: EMPTY_ICO.search,
                        title: '无匹配结果', text: '换个关键词或切换类型筛选'
                    }));
                } else if (kindFilter) {
                    box.appendChild(uiEmpty({
                        size: 'block', icon: EMPTY_ICO.folder,
                        title: '该分类暂无条目', text: '可切换其他分类，或添加一条记录',
                        action: { text: '添加条目', onClick: function () { openEntryModal(); } }
                    }));
                } else {
                    box.appendChild(uiEmpty({
                        size: 'block', icon: KINDS.password.icon,
                        title: '保险库还是空的', text: '账号密码、证件号、保单号、会员卡号，都能加密保存在这里',
                        action: { text: '添加第一条', onClick: function () { openEntryModal(); } }
                    }));
                }
                return;
            }
            box.innerHTML = list.map(e => {
                const k = kindOf(e);
                let expBadge = '';
                if (e.expireDate) {
                    const left = daysBetween(todayStr(), e.expireDate);
                    const cls = left < 0 ? 'danger' : (left <= 30 ? 'warn' : 'muted');
                    expBadge = `<span class="pill ${cls}">有效期至 ${e.expireDate}${left >= 0 ? '（' + left + '天）' : '（已过期）'}</span>`;
                }
                const u = safeHttpUrl(e.url);
                const urlLink = u ? ` <a href="${escapeHtml(u)}" target="_blank" rel="noopener noreferrer" class="pill muted" style="font-size:12px;text-decoration:none;" title="打开网址"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg> 网址</a>` : '';
                return `<div class="vault-item" data-id="${e.id}">
                    <div class="v-icon">${k.icon}</div>
                    <div class="v-info">
                        <div class="v-title">${escapeHtml(e.title)} <span class="pill muted" style="font-size:12px;">${k.name}</span>${urlLink}</div>
                        <div class="v-user">${escapeHtml(e.holder || e.username || '—')}${e.memberId ? ' · ' + (memberAvatarFor(e.memberId) || '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>') + ' ' + escapeHtml(memberName(e.memberId)) : ''}${e.remark ? ' · ' + escapeHtml(e.remark) : ''}</div>
                        ${expBadge}
                    </div>
                    <span class="pwd-mask" id="pwd-${e.id}" style="font-size:13px;color:var(--text-secondary);">••••••••</span>
                    <div class="task-actions">
                        <button class="icon-btn" title="显示/隐藏" onclick="togglePwd(${e.id})"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                        <button class="icon-btn" title="复制" onclick="copyPwd(${e.id})"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg></button>
                        <button class="icon-btn" title="编辑" onclick="editEntry(${e.id})"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
                        <button class="icon-btn danger" title="删除" onclick="removeEntry(${e.id})"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>
                    </div>
                </div>`;
            }).join('');
        }
        function togglePwd(id) {
            const el = document.getElementById('pwd-' + id);
            const e = entries.find(x => x.id === id);
            if (el.dataset.shown === '1') {
                el.textContent = '••••••••';
                el.classList.add('pwd-mask');
                el.dataset.shown = '0';
            } else {
                el.textContent = entryValue(e);
                el.classList.remove('pwd-mask');
                el.dataset.shown = '1';
            }
        }
        async function copyPwd(id) {
            const e = entries.find(x => x.id === id);
            const val = entryValue(e);
            try {
                await navigator.clipboard.writeText(val);
                showToast('已复制到剪贴板');
            } catch (err) {
                const ta = document.createElement('textarea');
                ta.value = val;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                showToast('已复制');
            }
        }

        function renderKindFields() {
            const k = KINDS[document.getElementById('vKind').value] || KINDS.password;
            document.getElementById('secretLabel').textContent = k.secretLabel + ' *';
            document.getElementById('secretHint').textContent = k.hasUser
                ? '支持随机生成强密码，加密存储、随时复制'
                : '加密存储，仅解锁后可见';
            document.getElementById('usernameGroup').style.display = k.hasUser ? 'block' : 'none';
            document.getElementById('holderGroup').style.display = k.hasUser ? 'none' : 'block';
            document.getElementById('expireGroup').style.display = (k.hasExpire || k.name === '其他') ? 'block' : 'none';
        }
        function openEntryModal() {
            editingId = null;
            document.getElementById('entryModalTitle').textContent = '添加条目';
            document.getElementById('vKind').innerHTML = Object.keys(KINDS).map(k => `<option value="${k}">${KINDS[k].icon} ${KINDS[k].name}</option>`).join('');
            document.getElementById('vKind').value = 'password';
            ['vTitle', 'vUsername', 'vSecret', 'vUrl', 'vRemark', 'vHolder', 'vExpire'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('vMember').value = '';
            document.getElementById('vSecret').type = 'password';
            renderKindFields();
            openModal('entryModal');
        }
        function editEntry(id) {
            const e = entries.find(x => x.id === id);
            if (!e) return;
            editingId = id;
            document.getElementById('entryModalTitle').textContent = '编辑条目';
            document.getElementById('vKind').innerHTML = Object.keys(KINDS).map(k => `<option value="${k}">${KINDS[k].icon} ${KINDS[k].name}</option>`).join('');
            document.getElementById('vKind').value = kindKey(e);
            renderKindFields();
            document.getElementById('vTitle').value = e.title;
            document.getElementById('vUsername').value = e.username || '';
            document.getElementById('vHolder').value = e.holder || '';
            document.getElementById('vSecret').value = entryValue(e);
            document.getElementById('vExpire').value = e.expireDate || '';
            document.getElementById('vMember').value = e.memberId || '';
            document.getElementById('vUrl').value = e.url || '';
            document.getElementById('vRemark').value = e.remark || '';
            document.getElementById('vSecret').type = 'password';
            openModal('entryModal');
        }
        function togglePwdInput() {
            const input = document.getElementById('vSecret');
            input.type = input.type === 'password' ? 'text' : 'password';
        }
        function genPwd() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789!@#$%&*';
            let pwd = '';
            const arr = new Uint32Array(14);
            crypto.getRandomValues(arr);
            for (let i = 0; i < 14; i++) pwd += chars[arr[i] % chars.length];
            document.getElementById('vSecret').value = pwd;
            document.getElementById('vSecret').type = 'text';
        }
        async function saveEntry() {
            const kind = document.getElementById('vKind').value;
            const titleEl = document.getElementById('vTitle');
            const secretEl = document.getElementById('vSecret');
            const k = KINDS[kind] || KINDS.password;
            const data = {
                kind,
                title: titleEl.value.trim(),
                username: document.getElementById('vUsername').value.trim(),
                holder: document.getElementById('vHolder').value.trim(),
                secret: secretEl.value,
                password: kind === 'password' ? secretEl.value : '',
                expireDate: document.getElementById('vExpire').value,
                memberId: document.getElementById('vMember').value || null,
                url: document.getElementById('vUrl').value.trim(),
                remark: document.getElementById('vRemark').value
            };
            if (!validateField(titleEl, { required: true, emptyMsg: '请填写标题' })) return;
            if (!editingId && !data.secret) return setFieldError(secretEl, '请填写' + k.secretLabel);
            clearFieldError(secretEl);
            const r = editingId ? await apiPut('/api/vault/entries/' + editingId, data) : await apiPost('/api/vault/entries', data);
            if (r.code === 200) { showToast('保存成功'); closeModal('entryModal'); loadEntries(); resetIdleTimer(); }
            else showToast(r.message || '保存失败', 'error');
        }
        async function removeEntry(id) {
            if (!(await confirmDel('确定删除该条目？'))) return;
            const r = await apiDelete('/api/vault/entries/' + id);
            if (r.code === 200) { showToast('删除成功'); loadEntries(); }
        }

        init();
    </script>
</body>
</html>
