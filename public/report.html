<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活月报 - 生活驾驶舱</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%233b82f6'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>家</text></svg>">
    <link rel="stylesheet" href="/css/theme/01-base.css?v=1.48.54">
    <link rel="stylesheet" href="/css/theme/02-late.css?v=1.48.54">
    <style>
        /* 月份选择器：移动端触控目标不小于 44px（桌面端沿用全站 36px 输入框规格） */
        @media (max-width: 768px) {
            #repMonth { height: 44px; min-height: 44px; }
        }
        .ri-icon { display: inline-flex; align-items: center; justify-content: center; }
    </style>


</head>
<body>
    <div id="pageContent" style="display:none;">
        <div class="card" style="margin-bottom:16px;">
            <div class="card-header">
                <span class="card-title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> 生活月报</span>
                <input type="month" id="repMonth" onchange="load()" style="width:auto;">
            </div>
        </div>

        <!-- 财务概览 -->
        <div class="card" style="margin-bottom:16px;">
            <div class="card-header">
                <span class="card-title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg> 收支概览</span>
                <span class="status-tag" style="background:var(--primary-light);color:var(--primary-strong);" id="repCount">0 笔</span>
            </div>
            <div class="ro-grid-3">
                <div style="background:var(--primary-light);border-radius:12px;padding:12px;text-align:center;">
                    <div style="font-size:12px;color:var(--text-secondary);">支出</div>
                    <div style="font-size:18px;font-weight:700;color:var(--danger);" id="repExpense">--</div>
                </div>
                <div style="background:var(--primary-light);border-radius:12px;padding:12px;text-align:center;">
                    <div style="font-size:12px;color:var(--text-secondary);">收入</div>
                    <div style="font-size:18px;font-weight:700;color:var(--amount-in);" id="repIncome">--</div>
                </div>
                <div style="background:var(--primary-light);border-radius:12px;padding:12px;text-align:center;">
                    <div style="font-size:12px;color:var(--text-secondary);">结余</div>
                    <div style="font-size:18px;font-weight:700;" id="repNet">--</div>
                </div>
            </div>
            <div class="ro-grid-4">
                <div style="text-align:center;font-size:12px;color:var(--text-secondary);"><span id="repAvgLabel">日均支出</span><br><b style="color:var(--text-primary);font-size:14px;" id="repAvg">--</b></div>
                <div style="text-align:center;font-size:12px;color:var(--text-secondary);">手工记账支出<br><b style="color:var(--text-primary);font-size:14px;" id="repManual">--</b></div>
                <div style="text-align:center;font-size:12px;color:var(--text-secondary);">人情支出<br><b style="color:var(--text-primary);font-size:14px;" id="repGift">--</b></div>
                <div style="text-align:center;font-size:12px;color:var(--text-secondary);">本月手记<br><b style="color:var(--text-primary);font-size:14px;" id="repNotesCount">--</b></div>
            </div>
            <div id="repMortgage" style="display:none;margin-top:10px;background:var(--danger-light);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--text-secondary);">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> 房贷月供 <b style="color:var(--danger);font-size:15px;" id="repMortgageVal">--</b> <span style="font-size:12px;color:var(--text-secondary);font-weight:400;">（账本支出不含房贷，实际月固定支出 = 账本支出 + 房贷）</span>
            </div>
        </div>

        <!-- 消费构成 -->
        <div class="card" style="margin-bottom:16px;">
            <div class="card-header">
                <span class="card-title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/></svg> 消费构成</span>
                <span class="status-tag" style="background:var(--primary-light);color:var(--primary-strong);" id="repTopCat">--</span>
            </div>
            <div id="repCats"></div>
        </div>

        <!-- 大额支出 -->
        <div class="card" style="margin-bottom:16px;">
            <div class="card-header"><span class="card-title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg> <span id="repTopTitle">本月大额支出 TOP</span></span></div>
            <div id="repTop"></div>
        </div>

        <!-- 人情往来 -->
        <div class="card" style="margin-bottom:16px;">
            <div class="card-header">
                <span class="card-title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></svg> 人情往来</span>
                <span class="status-tag" style="background:var(--primary-light);color:var(--primary-strong);" id="repGiftCount">0 笔</span>
            </div>
            <div style="font-size:13px;color:var(--text-secondary);line-height:1.9;" id="repGiftDetail">--</div>
        </div>

        <!-- 家庭纪念日 -->
        <div class="card" style="margin-bottom:16px;">
            <div class="card-header"><span class="card-title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"/><path d="M2 21h20"/><path d="M7 8v3"/><path d="M12 8v3"/><path d="M17 8v3"/><path d="M7 4h.01M12 4h.01M17 4h.01"/></svg> <span id="repAnnivTitle">本月家庭纪念日</span></span></div>
            <div id="repAnniv"></div>
        </div>

        <!-- 本月复诊 -->
        <div class="card" style="margin-bottom:16px;">
            <div class="card-header"><span class="card-title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg> <span id="repCheckupTitle">本月复诊</span></span></div>
            <div id="repCheckup"></div>
        </div>

        <!-- 本月手记（P4-06：篇数 + 标题回看） -->
        <div class="card" style="margin-bottom:16px;">
            <div class="card-header">
                <span class="card-title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg> <span id="repNotesTitle">本月手记</span></span>
                <a href="/notes" style="font-size:12px;">去写手记 →</a>
            </div>
            <div id="repNotes"></div>
        </div>

        <!-- 足迹 -->
        <div class="card">
            <div class="card-header"><span class="card-title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 6v16l6-2 6 2 6-2 4 2V6l-4-2-6 2-6-2-6 2z"/><path d="M8 6v.01"/><path d="M16 6v.01"/><path d="M8 16v.01"/><path d="M16 16v.01"/></svg> <span id="repFootTitle">本月足迹</span></span></div>
            <div style="font-size:13px;color:var(--text-secondary);" id="repFoot">--</div>
        </div>

        <!-- 月末净资产快照（R08） -->
        <div class="card" style="margin-top:16px;">
            <div class="card-header"><span class="card-title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> 当前净资产</span></div>
            <div style="font-size:20px;font-weight:700;" id="repNetWorth">--</div>
                    <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">资产（含账本账户余额） − 房贷 − 其他负债（与所选月份无关，始终为当前时点快照）</div>
        </div>
    </div>

    <script src="/js/common.js?v=1.48.54"></script>
    <script src="/js/lunar.js?v=1.48.54"></script>
    <script src="/js/voice.js?v=1.48.54"></script>
    <script src="/js/pwa.js?v=1.48.54"></script>
    <script src="/js/telemetry.js?v=1.48.54"></script>
    <script>
        renderShell('report', '生活月报');
        function money(n) { return '¥' + (+n || 0).toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
        function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

        function currentMonth() { return todayStr().slice(0, 7); }
        /* 周期文案：选中当月说「本月」；历史月份同年说「N月」、跨年说「YYYY年N月」 */
        function periodLabel(month) {
            if (month === currentMonth()) return '本月';
            const m = +month.slice(5);
            return (+month.slice(0, 4) === new Date().getFullYear()) ? (m + '月') : (month.slice(0, 4) + '年' + m + '月');
        }
        const PKG_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>';
        /* icon 安全渲染：仅内置静态 SVG 常量走 innerHTML；分类 icon 为用户数据（emoji），一律 textContent */
        function setIcon(el, icon, fallback) {
            if (!el) return;
            const s = (icon == null || String(icon).trim() === '') ? (fallback || '') : String(icon);
            if (/^\s*<svg[\s>]/i.test(s)) el.innerHTML = s;
            else el.textContent = s;
        }

        async function load() {
            const month = document.getElementById('repMonth').value || currentMonth();
            const isCur = month === currentMonth();
            const period = periodLabel(month);
            const r = await apiGet('/api/monthly-report?month=' + month);
            if (r.code !== 200) { showToast(r.msg || '月报加载失败', 'error'); return; }
            const d = r.data;
            document.getElementById('repExpense').textContent = money(d.expense);
            document.getElementById('repIncome').textContent = money(d.income);
            const netEl = document.getElementById('repNet');
            netEl.textContent = (d.net >= 0 ? '+' : '-') + money(Math.abs(d.net));
            netEl.style.color = d.net >= 0 ? 'var(--amount-in)' : 'var(--danger)';
            document.getElementById('repCount').textContent = d.count + ' 笔';
            document.getElementById('repAvgLabel').textContent = isCur ? ('日均支出（截至' + (d.elapsedDays || new Date().getDate()) + '日）') : '日均支出（全月）';
            document.getElementById('repAvg').textContent = money(d.avgDaily);
            document.getElementById('repManual').textContent = money(d.manualExpense);
            const nwEl = document.getElementById('repNetWorth');
            if (nwEl) nwEl.textContent = (d.netWorth >= 0 ? '' : '-') + money(Math.abs(d.netWorth));
            document.getElementById('repGift').textContent = money(d.giftExpense);
            // 手记 N 篇（monthly-report.notesCount）；标签跟随所选月份
            document.getElementById('repNotesCount').textContent = (d.notesCount || 0) + ' 篇';
            // 房贷月供（mortgagePayment>0 才展示）
            const mEl = document.getElementById('repMortgage');
            if (d.mortgagePayment > 0) {
                mEl.style.display = 'block';
                document.getElementById('repMortgageVal').textContent = money(d.mortgagePayment);
            } else { mEl.style.display = 'none'; }
            /* 区块标题跟随所选月份 */
            document.getElementById('repTopTitle').textContent = period + '大额支出 TOP';
            document.getElementById('repAnnivTitle').textContent = period + '家庭纪念日';
            document.getElementById('repCheckupTitle').textContent = period + '复诊';
            document.getElementById('repNotesTitle').textContent = period + '手记';
            document.getElementById('repFootTitle').textContent = period + '足迹';
            const tc = document.getElementById('repTopCat');
            tc.textContent = '';
            if (d.topCat) {
                setIcon(tc, d.topCat.icon, '');
                tc.appendChild(document.createTextNode(' ' + d.topCat.name + ' · ' + (d.topCat.percent || 0) + '%'));
            } else { tc.textContent = '--'; }
            renderCats(d.byCategory || [], period);
            renderTop(d.top || [], period);
            document.getElementById('repGiftCount').textContent = d.giftCount + ' 笔';
            document.getElementById('repGiftDetail').innerHTML = `${escapeHtml(period)}人情：收 <b style="color:var(--amount-in);">${money(d.giftIn)}</b> · 出 <b style="color:var(--danger);">${money(d.giftOut)}</b>`;
            renderList('repAnniv', d.anniv, '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"/><path d="M2 21h20"/><path d="M7 8v3"/><path d="M12 8v3"/><path d="M17 8v3"/><path d="M7 4h.01M12 4h.01M17 4h.01"/></svg>', isCur ? '暂无本月纪念日' : period + '暂无纪念日');
            renderList('repCheckup', d.checkups, '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>', isCur ? '暂无本月复诊' : period + '暂无复诊');
            renderList('repNotes', d.noteTitles || [], '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>', isCur ? '本月没有写手记' : period + '没有写手记');
            document.getElementById('repFoot').textContent = `${period}点亮足迹 ${d.footprintCount} 处`;
        }

        function renderCats(list, period) {
            const box = document.getElementById('repCats');
            if (!list.length) { box.textContent = period + '暂无支出。'; return; }
            box.innerHTML = list.map((c, i) => `
                <div style="margin-bottom:10px;">
                    <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;">
                        <span><span class="ri-icon" data-ri="c${i}"></span> ${escapeHtml(c.name)}${c.auto ? ' <span style="font-size:12px;color:var(--text-secondary);">自动</span>' : ''}</span>
                        <b>${money(c.amount)}<span style="color:var(--text-secondary);font-weight:400;"> · ${c.percent || 0}%</span></b>
                    </div>
                    <div style="height:6px;background:var(--primary-light);border-radius:3px;overflow:hidden;"><div style="height:100%;width:${Math.max(2, c.percent || 0)}%;background:${c.auto ? 'var(--amount-in)' : 'var(--grad-bar)'};"></div></div>
                </div>`).join('');
            list.forEach((c, i) => setIcon(box.querySelector('[data-ri="c' + i + '"]'), c.icon, PKG_SVG));
        }

        function renderTop(list, period) {
            const box = document.getElementById('repTop');
            if (!list.length) { box.textContent = period + '无支出记录。'; return; }
            box.innerHTML = list.map((x, i) => `
                <div class="expiry-row" style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-color);">
                    <div>
                        <div style="font-weight:600;font-size:14px;">${i + 1}. <span class="ri-icon" data-ri="t${i}"></span> ${escapeHtml(x.cat)}</div>
                        <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">${x.date}${x.method ? ' · ' + escapeHtml(x.method) : ''}${x.remark ? ' · ' + escapeHtml(x.remark) : ''}</div>
                    </div>
                    <b style="font-size:14px;color:var(--danger);">${money(x.amount)}</b>
                </div>`).join('');
            list.forEach((x, i) => setIcon(box.querySelector('[data-ri="t' + i + '"]'), x.icon, ''));
        }

        function renderList(id, list, icon, empty) {
            const box = document.getElementById(id);
            if (!list.length) { box.textContent = empty; return; }
            box.innerHTML = list.map(x => `
                <div class="expiry-row" style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border-color);">
                    <div>
                        <div style="font-weight:600;font-size:14px;">${icon} ${escapeHtml(x.title)}</div>
                        <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">${x.date}${x.member ? ' · ' + escapeHtml(x.member) : ''}</div>
                    </div>
                </div>`).join('');
        }

        document.getElementById('repMonth').value = currentMonth();
        load();
    </script>
</body>
</html>
