    <div id="pageContent" style="display:none;">
        <div class="card">
            <div class="card-header"><span class="card-title" style="font-size:16px;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> 帮助中心</span></div>

    <script src="/js/common.js?v=1.48.54"></script>

    <script src="/js/telemetry.js?v=1.48.54"></script>
    <script>
        renderShell('help-center', '帮助中心');

        const FAQS = [
            ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg> 生活驾驶舱看什么？', '首页把今天要做的事、30 天内临期证件、即将到来的纪念日/生日、本月支出、保险库到期证件放在一屏，早上扫一眼就知道今天家里要处理什么。'],
            ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg> 什么是一次性事务？', '在「一次性事务」页面，左侧是月历（带农历和事务标记点），用来记录绑在某一天的待办（如"明天下午3点接孩子"），点击某天即可查看/新增当天的事务，支持提醒时间、状态（待处理/进行中/已完成）、颜色标记和置顶。'],
            ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/><path d="M6.38 18.7 4 21"/><path d="M17.64 18.67 20 21"/></svg> 循环事务怎么用？', '「循环事务」是全家的周期调度引擎：支持每天/每周/每月/每年固定日期，以及「每隔 N 天/周/月/年」按上次完成时间自动顺延（如每 6 个月换空调滤芯）。换滤芯、空调清洗、全家体检、车辆年检、保单年检都能用一套规则管理，点「<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg> 完成」即排下一次，逾期会标红。'],
            ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg> 备忘手记怎么用？', '左侧笔记列表 + 右侧富文本编辑器双栏设计，支持按日期范围和关键词搜索，自动分页。编辑器支持加粗/斜体/下划线/删除线、三级标题、有序与无序列表、引用、分割线、链接，粘贴内容会自动净化；Ctrl+S 快速保存，旧的纯文本笔记打开时会自动转换成段落。'],
            ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3z"/></svg> 笔记里的 AI 能做什么？', '选中一段文字后点「润色 / 扩写 / 精简 / 翻译」，AI 结果会直接替换选中内容（可 Ctrl+Z 撤销）。不选中文字时，「整篇摘要 / 起个标题 / 续写 / 转成待办」会基于整篇笔记生成结果，先弹出预览，确认后点「插入到光标处」写回正文，「起个标题」则直接填入标题栏。'],
            ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="m8 11 2 2 4-4"/></svg> 家庭成员能做什么？', '家庭成员是家庭主线的中心：记录称呼、关系、生日、电话、备注，并把纪念日、证件效期物品、保险库条目、人情往来都挂到对应家人身上，在家人的详情里一站式查看。删除家人只会解除关联，不会删除这些数据。'],
            ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> 纪念日的两种模式？', '倒计时显示"距离某天还有多少天"（可选每年循环）；正计时显示"已经过去多少天"，适合纪念日、打卡天数等。可在纪念日中「归属家人」，与家庭成员联动。'],
            ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg> 家庭账本和人情记账什么关系？', '「家庭账本」记录日常收支（餐饮/日用/交通/医疗等分类，支持关联家人和支付方式）；「人情记账」保留独立页面记录礼金往来，并自动折算为账本里的「人情往来」分类汇入总账，不用重复录入。'],
            ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></svg> 人情记账支持什么？', '记录人情往来收支，支持往来对象、分组、事项/关系类型自定义，可把往来对象关联到家人；有年度收支统计、分组统计、月度图表和 CSV 导出。'],
            ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg> 证件效期的颜色含义？', '红色=已过期，橙色=7 天内到期，黄色=30 天内到期，绿色=正常。除到期日外，还可记录存放位置、保修到期、编号和附件清单，支持搜索、按家人筛选和 CSV 导出。'],
            ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> 轨迹记录怎么用？', '「轨迹记录」是真正的地图记录页：建一次行程（可填标题、日期、心情、天气、同行家人），然后在行程里逐个记录打卡点——地图选点、搜索地名或直接用手机定位，每个点可写随记、打心情标签、传照片，地图上会把这些点连成完整轨迹。另有「自动记录」按钮，开始后浏览器每隔一段时间（可在系统设置里调，默认 10 分钟）自动采一个定位点，适合出门一路自动留痕——注意记录期间需保持页面打开，且浏览器定位要求 HTTPS 或 localhost。'],
            ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 6v16l6-2 6 2 6-2 4 2V6l-4-2-6 2-6-2-6 2z"/><path d="M8 6v.01"/><path d="M16 6v.01"/><path d="M8 16v.01"/><path d="M16 16v.01"/></svg> 轨迹页提示"未配置地图 Key"怎么办？', '地图相关共用一个 Key：腾讯位置服务 Key。到腾讯位置服务（lbs.qq.com）免费申请，勾选 WebServiceAPI 与 JavaScript API GL，填到「系统设置 → 位置轨迹 → 地图 Key」即可。轨迹沉浸页（位置轨迹）的底图是高德瓦片（免费，无需 Key），该 Key 只用于地点搜索 / 逆地理定位；「我的足迹」页有 Key 时用腾讯地图底图展示足迹光点，没 Key 时用城市卡片列表完整呈现，记录、照片、统计功能都不受影响。照片原图保存在服务端 data/uploads 目录，不会上传到任何第三方。'],
            ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>「足迹回顾」怎么点亮城市？', '每次在轨迹记录里打卡，系统会自动从地址识别所在城市并点亮；也可以在「足迹回顾」页用「+ 点亮城市」手动补记去过的地方（适合早年的旅行）。点亮后会累计到省份覆盖，并解锁成就徽章。城市卡片会显示首次到达日期、打卡点数、停留天数和照片。点亮规则可在「系统设置 → 位置轨迹 → 城市点亮规则」调整：默认打卡即点亮，也可改为需停留 15/30/60/120 分钟才算点亮（按打卡点间隔推算，相邻超过 60 分钟视为离场；手动点亮不受影响；收紧后部分已点亮城市与成就会暂时回落，调回即恢复）。'],
            ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg> 年度足迹报告是什么？', '「足迹回顾 → 年度报告」会按年份汇总：走过多少城市与省份、今年新点亮了哪些城市、各月足迹分布、去得最多的地方、心情分布和最近行程，并支持一键导出文本，方便留存或分享。'],
            ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 6v16l6-2 6 2 6-2 4 2V6l-4-2-6 2-6-2-6 2z"/><path d="M8 6v.01"/><path d="M16 6v.01"/><path d="M8 16v.01"/><path d="M16 16v.01"/></svg> 足迹没有地图底图？', '『我的足迹』页地图有两种视图：<b>填色图</b>（默认）无需任何 Key，中国地图上去过的省份整块点亮，支持按年份回看、悬浮看首访时间、点击省份查看城市足迹；<b>光点图</b>在真实底图上展示足迹光点，需在「系统设置 → 位置轨迹 → 地图 Key」填入腾讯位置服务 Key（lbs.qq.com 免费申请，勾选 JavaScript API GL）。没配置 Key 也能用填色图完整体验。'],
            ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg> 贷款计算支持哪种方式？', '等额本息（月供固定）和等额本金（月供递减），提供逐期还款明细表和利息总额对比。'],
            ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg> 如何更换主题？', '「系统设置 → 外观与主题」可切换 6 种主题色和深色模式，实时生效。'],
            ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg> 每日晨报和事务提醒分别在哪里配？', '两套推送是分开的：<b>每日晨报</b>（每天定时一条今日摘要）在「系统设置 → 消息推送」配置；<b>事务提醒</b>的多通道与消息模板在「通用配置 → 通道管理 / 消息模板」配置。两处页面互相有跳转入口。'],
            ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2h4v4h-1v1a2 2 0 1 1-2 0V6h-1z"/><path d="M14 6h4a2 2 0 0 1 2 2v3h-1a2 2 0 1 0 0 4h1v3a2 2 0 0 1-2 2h-3v-1a2 2 0 1 0-4 0v1H6a2 2 0 0 1-2-2v-3h1a2 2 0 1 0 0-4H4V8a2 2 0 0 1 2-2h4z"/></svg> 想关掉某个功能（如备忘手记、我的足迹）怎么办？', '到「模块管理」页：<b>模块开关</b>控制左侧导航入口的显示/隐藏；<b>数据开关</b>控制是否隐藏该模块的数据并停止相关推送。两者语义不同，可按需分别设置。'],
            ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg> AI 小助手怎么启用？', '任意页面右下角都有一个 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></svg> 悬浮入口（可在「系统设置 → 外观与主题 → AI 悬浮图标」关掉）。点开是右侧抽屉，可以直接提问，也会根据你当前所在页面给出对应的快捷动作，例如在「家庭账本」里问"分析本月支出"。设置入口在抽屉右上角的 <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>，也可以在「AI 小助手」页或笔记页的工具条里打开，三处共用同一份配置：在 DeepSeek / 通义千问 / 豆包 三选一填入 API Key 并打开开关、点保存即可。三家都是 OpenAI 兼容接口，填任意一家就能用，也可以自定义 BaseURL 和模型名。未配置时助手处于演示模式，只能答日期、农历等本地问题。'],
            ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> AI 的 API Key 和对话安全吗？', 'Key 使用 AES-256-GCM 加密后存放在本机 data/db.json，界面上永远不会回传明文（只显示"已配置"），导出备份时也不含 Key。对话记录仅保存在本机数据库，可在会话列表逐条删除。AI 回答基于你的家庭数据汇总（今日事务/循环事务/证件效期/纪念日/本月账本），只发给你自己填的那个 AI 服务商，不经过任何第三方。AI 写回笔记的富文本会再做一次白名单净化（去掉脚本、事件属性和 javascript: 链接）。'],
            ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> 数据能备份吗？', '两层备份都在「系统设置 → 系统管理 → 数据管理」：<b>JSON 备份</b>导出全部业务数据（可再导入恢复）；<b>完整备份（ZIP）</b>额外包含上传图片与密钥锚点并带 SHA-256 校验清单，可离机保存，恢复时解压后把 db.json / .storage-key / uploads/ 放回 data/ 目录即可。另可配置 S3/MinIO 自动备份。'],
            ['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="2"/><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/></svg> 网页版和小程序版有什么区别？哪个是完整版？', '<b>网页版是完整版</b>，功能以它为准。小程序适合手机快速查看/记录，已覆盖：今天/待办/账本/健康/纪念日/笔记/家庭成员/证件效期/保险库/家底/月报/足迹回顾/人情往来/循环事务/设置/AI。以下能力目前只在网页版：<b>轨迹记录（地图打卡）</b>、<b>足迹填色地图/年份视图/足迹名片/点亮规则设置</b>、<b>房贷计算器</b>、通用配置（通道/模板/外部系统）、模块管理、帮助中心、使用洞察、PWA 安装到桌面、完整备份 ZIP 导出导入。两端共用同一个后端和数据库，数据实时一致；小程序需要后端配置 HTTPS 域名后才能在手机上使用。']

        document.getElementById('faqList').innerHTML = FAQS.map(([q, a]) => `
            <details style="border-bottom:1px solid var(--border-color);">
