<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人情记账 - 生活驾驶舱</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%233b82f6'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>家</text></svg>">
    <link rel="stylesheet" href="/css/theme/01-base.css?v=1.48.54">
    <link rel="stylesheet" href="/css/theme/02-late.css?v=1.48.54">
    <link rel="stylesheet" href="/css/components.css?v=1.48.54">
    <style>
        @media (max-width:640px){.data-table .hide-xs{display:none}}
        /* 移动端首屏修复（仅本页 ≤768px 生效）：压缩统计卡/分组卡/卡片间距，
           使记录列表首行操作钮上移出底部 .mobile-tabbar（y787-844）遮挡带 */
        @media (max-width:768px){
            body[data-ai-page="gift-records"] .gift-stat-grid{margin-bottom:8px;gap:10px;}
            body[data-ai-page="gift-records"] .gift-stat{padding:10px 14px;}
            body[data-ai-page="gift-records"] .gift-stat .g-value{margin-top:2px;}
            body[data-ai-page="gift-records"] .card{margin-bottom:12px;padding:14px;}
            body[data-ai-page="gift-records"] .card-header{margin-bottom:4px;}
            body[data-ai-page="gift-records"] #pageContent .group-stats-scroll{padding-bottom:2px;}
            body[data-ai-page="gift-records"] #pageContent .field-hint{line-height:1.3;margin-bottom:6px !important;}
            body[data-ai-page="gift-records"] #pageContent .form-inline{gap:8px;margin-bottom:8px !important;}
        }
    </style>


</head>
<body>
    <div id="pageContent" style="display:none;">
        <!-- 年度统计 -->
        <div class="gift-stat-grid">
            <div class="gift-stat in"><div class="g-label"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> 收入合计</div><div class="g-value" id="sumIncome">¥0</div></div>
            <div class="gift-stat out"><div class="g-label"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> 支出合计</div><div class="g-value" id="sumOutcome">¥0</div></div>
            <div class="gift-stat net"><div class="g-label"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg> 净额</div><div class="g-value" id="sumNet">¥0</div></div>
            <div class="gift-stat"><div class="g-label"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg> 记录笔数</div><div class="g-value" id="sumCount" style="color:var(--text-primary);">0</div></div>
        </div>

        <!-- 按分组收支 -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">按分组收支 <span style="font-size:12px;color:var(--text-secondary);" id="groupYear"></span></span>
            </div>
            <div class="group-stats-scroll" id="groupStatsCards"><span style="font-size:13px;color:var(--text-secondary);">暂无分组数据</span></div>
            <!-- 月度图表 -->
            <div id="chartBox" style="display:none;margin-top:16px;">
                <div style="font-size:13px;color:var(--text-secondary);margin-bottom:6px;"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg> 月度收支（绿=收 红=支）</div>
                <div class="bar-chart" id="barChart"></div>
            </div>
        </div>

        <!-- 往来平衡（回礼视图） -->
        <div class="card">
            <div class="card-header">
                <span class="card-title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg> 往来平衡</span>
                <span style="font-size:12px;color:var(--text-secondary);">谁给得多、谁宜回礼，一眼看清</span>
            </div>
            <div id="balanceWrap"><span style="font-size:13px;color:var(--text-secondary);">加载中…</span></div>
        </div>

        <!-- 工具栏 + 列表 -->
        <div class="card">
            <p class="field-hint" style="margin-bottom:12px;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg> 人情往来已自动汇总进 <a href="/ledger">家庭账本</a> 的「人情往来」分类，无需重复记账；把往来对象关联到 <a href="/family">家庭成员</a>，即可在家人详情里看到完整往来记录。
            </p>
            <div class="form-inline" style="margin-bottom:14px;">
                <button class="btn btn-primary btn-sm" onclick="openGiftModal()">＋ 新增记录</button>
                <button class="btn btn-secondary btn-sm" onclick="exportCSV()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> 导出CSV</button>
                <button class="btn btn-secondary btn-sm" onclick="openPersonModal()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> 往来对象</button>
                <button class="btn btn-secondary btn-sm" onclick="openGroupModal()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg> 分组管理</button>
                <button class="btn btn-secondary btn-sm" onclick="openConfigModal()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg> 事项/关系配置</button>
                <button class="btn btn-secondary btn-sm" onclick="toggleCharts()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg> 统计图表</button>
            </div>
            <div class="form-inline" style="margin-bottom:14px;">
                <select id="filterYear" onchange="loadAll()"></select>
                <select id="filterDirection" onchange="applyFilters()">
                    <option value="">全部方向</option>
                    <option value="in">收入</option>
                    <option value="out">支出</option>
                </select>
                <select id="filterEventType" onchange="applyFilters()"><option value="">全部事项</option></select>
                <select id="filterPerson" onchange="applyFilters()"><option value="">全部对象</option></select>
            </div>
            <div id="recordsWrap"></div>
        </div>
    </div>

    <!-- 新增/编辑记录 -->
    <div id="giftModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="giftModalTitle">新增记录</h3>
                <button class="modal-close" onclick="closeModal('giftModal')" aria-label="关闭">&times;</button>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>往来对象 *</label>
                    <select id="gPerson"></select>
                </div>
                <div class="form-group">
                    <label>关系</label>
                    <select id="gRelation"></select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>事项</label>
                    <select id="gEvent"></select>
                </div>
                <div class="form-group">
                    <label>方向</label>
                    <select id="gDirection">
                        <option value="in">收入（对方给我）</option>
                        <option value="out">支出（我给对方）</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label>金额（元）*</label>
                    <input type="number" id="gAmount" min="0" step="0.01" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>日期 *</label>
                    <input type="date" id="gDate">
                </div>
            </div>
            <div class="form-group">
                <label>备注</label>
                <input type="text" id="gRemark" placeholder="备注（可选）">
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('giftModal')">取消</button>
                <button class="btn btn-primary" onclick="saveGift()">保存</button>
            </div>
        </div>
    </div>

    <!-- 往来对象管理 -->
    <div id="personModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>往来对象管理</h3>
                <button class="modal-close" onclick="closeModal('personModal')" aria-label="关闭">&times;</button>
            </div>
            <div class="form-inline" style="margin-bottom:12px;flex-wrap:wrap;">
                <input type="text" id="newPersonName" placeholder="姓名" style="flex:1;min-width:120px;">
                <select id="newPersonMember" style="width:auto;"></select>
                <select id="newPersonGroup" style="width:auto;"></select>
                <input type="date" id="newPersonBirthday" title="生日（可选，YYYY-MM-DD）" style="width:auto;">
                <button class="btn btn-primary btn-sm" onclick="addPerson()">添加</button>
            </div>
            <div id="personList" style="max-height:300px;overflow-y:auto;"></div>
        </div>
    </div>

    <!-- 分组管理 -->
    <div id="groupModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>分组管理</h3>
                <button class="modal-close" onclick="closeModal('groupModal')" aria-label="关闭">&times;</button>
            </div>
            <div class="form-inline" style="margin-bottom:12px;">
                <input type="text" id="newGroupName" placeholder="分组名称" style="flex:1;">
                <button class="btn btn-primary btn-sm" onclick="addGroup()">添加</button>
            </div>
            <div id="groupList" style="max-height:300px;overflow-y:auto;"></div>
        </div>
    </div>

    <!-- 事项/关系配置 -->
    <div id="configModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>事项 / 关系配置</h3>
                <button class="modal-close" onclick="closeModal('configModal')" aria-label="关闭">&times;</button>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                <div>
                    <div style="font-size:13px;font-weight:600;margin-bottom:8px;">事项类型</div>
                    <div class="form-inline" style="margin-bottom:8px;">
                        <input type="text" id="newEventLabel" placeholder="如：婚礼" style="flex:1;">
                        <button class="btn btn-primary btn-sm" onclick="addConfig('EVENT_TYPE')">添加</button>
                    </div>
                    <div id="eventTypeList" style="max-height:200px;overflow-y:auto;"></div>
                </div>
                <div>
                    <div style="font-size:13px;font-weight:600;margin-bottom:8px;">关系类型</div>
                    <div class="form-inline" style="margin-bottom:8px;">
                        <input type="text" id="newRelationLabel" placeholder="如：朋友" style="flex:1;">
                        <button class="btn btn-primary btn-sm" onclick="addConfig('RELATION_TYPE')">添加</button>
                    </div>
                    <div id="relationTypeList" style="max-height:200px;overflow-y:auto;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/common.js?v=1.48.54"></script>
    <script src="/js/lunar.js?v=1.48.54"></script>
    <script src="/js/voice.js?v=1.48.54"></script>
    <script src="/js/pwa.js?v=1.48.54"></script>
    <script src="/js/telemetry.js?v=1.48.54"></script>
    <script src="/js/ui.js?v=1.48.54"></script>
    <script>
        renderShell('gift-records', '人情记账');

        let persons = [], groups = [], events = [], relations = [], records = [], yearRecords = [], stats = null, members = [];
        let editingId = null;

        /* 空态图标（可信内部 SVG，走 uiEmpty 的 icon 参数） */
        const EMPTY_ICO = {
            search: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
            gift: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></svg>'
        };

        function memberName(id) { const m = members.find(x => x.id === id); return m ? m.name : ''; }
        function memberAvatarFor(id) { const m = members.find(x => x.id === id); return (window.memberAvatarHtml && m) ? memberAvatarHtml(m) : ''; }

        /* 全量加载：仅在年份变更、增删记录/对象/分组后调用 */
        async function loadAll() {
            const year = document.getElementById('filterYear').value || new Date().getFullYear();
            const [pRes, gRes, eRes, relRes, rRes, sRes, fRes] = await Promise.all([
                apiGet('/api/gift-persons'), apiGet('/api/gift-groups'),
                apiGet('/api/gift-configs?type=EVENT_TYPE'), apiGet('/api/gift-configs?type=RELATION_TYPE'),
                apiGet('/api/gift-records?year=' + year),
                apiGet('/api/gift-records/statistics?year=' + year),
                apiGet('/api/family')
            ]);
            persons = pRes.data || []; groups = gRes.data || [];
            events = eRes.data || []; relations = relRes.data || [];
            yearRecords = rRes.data || []; stats = sRes.data;
            members = fRes.data || [];
            renderFilters(); renderStats(); renderGroupStats(); renderBalance(); renderCharts(); applyFilters();
        }

        /* 客户端筛选：方向/事项/对象 直接从全年数据派生，0 请求（年份变更才走 loadAll 重拉） */
        function applyFilters() {
            const direction = document.getElementById('filterDirection').value;
            const eventType = document.getElementById('filterEventType').value;
            const personId = document.getElementById('filterPerson').value;
            records = yearRecords.filter(r =>
                (!direction || r.direction === direction) &&
                (!eventType || r.eventType === eventType) &&
                (!personId || String(r.personId) === personId)
            );
            renderRecords();
        }
        function clearGiftFilters() {
            document.getElementById('filterDirection').value = '';
            document.getElementById('filterEventType').value = '';
            document.getElementById('filterPerson').value = '';
            applyFilters();
        }
        function anyGiftFilterActive() {
            return document.getElementById('filterDirection').value !== ''
                || document.getElementById('filterEventType').value !== ''
                || document.getElementById('filterPerson').value !== ''
                || String(document.getElementById('filterYear').value || '') !== String(new Date().getFullYear());
        }

        function renderStats() {
            if (!stats) return;
            document.getElementById('sumIncome').textContent = fmtMoney(stats.income);
            document.getElementById('sumOutcome').textContent = fmtMoney(stats.outcome);
            document.getElementById('sumNet').textContent = (stats.net >= 0 ? '+' : '') + fmtMoney(stats.net).replace('¥-', '-¥');
            document.getElementById('sumCount').textContent = stats.count;
        }

        function renderGroupStats() {
            const box = document.getElementById('groupStatsCards');
            document.getElementById('groupYear').textContent = '· ' + (document.getElementById('filterYear').value || new Date().getFullYear()) + '年';
            if (!groups.length) { box.innerHTML = '<span style="font-size:13px;color:var(--text-secondary);">暂无分组，可点击「分组管理」创建</span>'; return; }
            box.innerHTML = groups.map(g => {
                const ps = persons.filter(p => p.groupId === g.id).map(p => p.id);
                const rs = yearRecords.filter(r => ps.includes(r.personId));
                const income = rs.filter(r => r.direction === 'in').reduce((s, r) => s + r.amount, 0);
                const outcome = rs.filter(r => r.direction === 'out').reduce((s, r) => s + r.amount, 0);
                return `<div class="group-stat-card">
                    <div class="g-name">${escapeHtml(g.name)}</div>
                    <div class="g-in">收 ${fmtMoney(income)}</div>
                    <div class="g-out">支 ${fmtMoney(outcome)}</div>
                </div>`;
            }).join('');
        }

        function personName(id) { const p = persons.find(x => x.id === id); return p ? p.name : '未知'; }

        /* 往来平衡：按对象聚合收支净额，标出宜回礼/超期未往来（当前筛选年份范围） */
        function renderBalance() {
            const box = document.getElementById('balanceWrap');
            if (!persons.length) { box.innerHTML = '<span style="font-size:13px;color:var(--text-secondary);">暂无往来对象，可点击「往来对象」创建</span>'; return; }
            const rows = persons.map(p => {
                const rs = yearRecords.filter(r => r.personId === p.id);
                const income = rs.filter(r => r.direction === 'in').reduce((s, r) => s + r.amount, 0);
                const outcome = rs.filter(r => r.direction === 'out').reduce((s, r) => s + r.amount, 0);
                const last = rs.map(r => r.date).sort().pop() || '';
                return { name: p.name, income, outcome, net: income - outcome, last, count: rs.length };
            });
            const list = rows.filter(r => r.count).sort((a, b) => Math.abs(b.net) - Math.abs(a.net));
            if (!list.length) { box.innerHTML = '<span style="font-size:13px;color:var(--text-secondary);">当前筛选范围内暂无往来记录</span>'; return; }
            const days = d => Math.floor((new Date() - new Date(d)) / 86400000);
            box.innerHTML = '<div class="table-wrap"><table class="data-table"><thead><tr>' +
                '<th>往来对象</th><th>对方给我</th><th>我给对方</th><th>净额</th><th>状态</th><th class="hide-xs">最近往来</th>' +
                '</tr></thead><tbody>' + list.map(r => {
                    const tag = r.net > 0
                        ? '<span class="status-tag" style="background:rgba(220,38,38,.12);color:var(--amount-out);">宜回礼</span>'
                        : (r.net < 0 ? '<span class="status-tag" style="background:rgba(21,128,61,.12);color:var(--amount-in);">我给得多</span>'
                            : '<span class="status-tag" style="background:var(--bg-inset);color:var(--text-secondary);">持平</span>');
                    const stale = r.last && days(r.last) > 180;
                    return `<tr>
                        <td data-label="对象" style="font-weight:500;">${escapeHtml(r.name)}</td>
                        <td data-label="对方给我" style="color:var(--amount-in);">${fmtMoney(r.income)}</td>
                        <td data-label="我给对方" style="color:var(--amount-out);">${fmtMoney(r.outcome)}</td>
                        <td data-label="净额" style="font-weight:700;color:${r.net > 0 ? 'var(--amount-out)' : r.net < 0 ? 'var(--amount-in)' : 'inherit'};">${r.net > 0 ? '+' : ''}${fmtMoney(r.net).replace('¥-', '-¥')}</td>
                        <td data-label="状态">${tag}${stale ? ' <span class="status-tag" style="background:var(--bg-inset);color:var(--text-secondary);">超 6 个月未往来</span>' : ''}</td>
                        <td class="hide-xs">${r.last || '—'}</td>
                    </tr>`;
                }).join('') + '</tbody></table></div>' +
                '<p class="field-hint" style="margin:10px 4px 0;">净额 = 对方给我的 − 我给对方的，正数表示对方给得多、宜找机会回礼；统计范围为当前筛选年份，改年份自动重算。</p>';
        }

        function renderRecords() {
            const wrap = document.getElementById('recordsWrap');
            if (!records.length) {
                wrap.innerHTML = '';
                if (anyGiftFilterActive()) {
                    wrap.appendChild(uiEmpty({
                        size: 'block', icon: EMPTY_ICO.search,
                        title: '当前筛选条件下暂无记录', text: '换个年份或筛选条件试试',
                        action: { text: '清除筛选', kind: 'ghost', onClick: function () { clearGiftFilters(); } }
                    }));
                    return;
                }
                wrap.appendChild(uiEmpty({
                    size: 'block', icon: EMPTY_ICO.gift,
                    title: '暂无人情记录', text: '记录礼金往来，自动统计收支持平与关系账目',
                    action: { text: '添加第一条记录', onClick: function () { openGiftModal(); } }
                }));
                return;
            }
            wrap.innerHTML = '<div class="table-wrap"><table class="data-table gift-table"><thead><tr>' +
                '<th>日期</th><th>对象</th><th class="hide-xs">关系</th><th class="hide-xs">事项</th><th>方向</th><th>金额</th><th class="hide-xs">备注</th><th style="width:90px;">操作</th>' +
                '</tr></thead><tbody>' + records.map(r => `
                    <tr>
                        <td data-label="日期">${r.date}</td>
                        <td data-label="对象" style="font-weight:500;">${escapeHtml(personName(r.personId))}
                            ${r.memberId ? `<div style="font-size:12px;color:var(--text-secondary);">${memberAvatarFor(r.memberId) || '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>'} ${escapeHtml(memberName(r.memberId))}</div>` : ''}</td>
                        <td class="hide-xs">${escapeHtml(r.relation || '—')}</td>
                        <td class="hide-xs">${escapeHtml(r.eventType || '—')}</td>
                        <td data-label="方向">${r.direction === 'in'
                            ? '<span class="status-tag" style="background:rgba(21,128,61,.12);color:var(--amount-in);">收</span>'
                            : '<span class="status-tag" style="background:rgba(220,38,38,.12);color:var(--amount-out);">支</span>'}</td>
                        <td data-label="金额" style="font-weight:700;color:${r.direction === 'in' ? 'var(--amount-in)' : 'var(--amount-out)'};">${r.direction === 'in' ? '+' : '-'}${fmtMoney(r.amount)}</td>
                        <td class="hide-xs" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(r.remark || '')}</td>
                        <td data-label="" style="text-align:right;white-space:nowrap;">
                            <button class="icon-btn" title="编辑" aria-label="编辑" onclick="editGift(${r.id})"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
                            <button class="icon-btn danger" title="删除" aria-label="删除" onclick="removeGift(${r.id})"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>
                        </td>
                    </tr>`).join('') + '</tbody></table></div>';
        }

        function renderFilters() {
            const curYear = document.getElementById('filterYear').value;
            const curEvent = document.getElementById('filterEventType').value;
            const curPerson = document.getElementById('filterPerson').value;
            const years = new Set(yearRecords.map(r => r.date.slice(0, 4)));
            years.add(String(new Date().getFullYear()));
            const ySel = document.getElementById('filterYear');
            ySel.innerHTML = [...years].sort().reverse().map(y => `<option value="${y}">${y}年</option>`).join('');
            if (curYear && [...years].includes(curYear)) ySel.value = curYear;
            const eSel = document.getElementById('filterEventType');
            eSel.innerHTML = '<option value="">全部事项</option>' +
                events.map(e => `<option value="${e.label}">${escapeHtml(e.label)}</option>`).join('');
            if (curEvent && events.some(e => e.label === curEvent)) eSel.value = curEvent;
            const pSel = document.getElementById('filterPerson');
            pSel.innerHTML = '<option value="">全部对象</option>' +
                persons.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
            if (curPerson && persons.some(p => String(p.id) === curPerson)) pSel.value = curPerson;
            // 弹窗内的下拉
            document.getElementById('gPerson').innerHTML = persons.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
            document.getElementById('gRelation').innerHTML = '<option value="">（不选）</option>' + relations.map(e => `<option value="${e.label}">${escapeHtml(e.label)}</option>`).join('');
            document.getElementById('gEvent').innerHTML = '<option value="">（不选）</option>' + events.map(e => `<option value="${e.label}">${escapeHtml(e.label)}</option>`).join('');
            document.getElementById('newPersonGroup').innerHTML = '<option value="">未分组</option>' + groups.map(g => `<option value="${g.id}">${escapeHtml(g.name)}</option>`).join('');
            document.getElementById('newPersonMember').innerHTML = '<option value="">不关联家人</option>' + members.map(m => `<option value="${m.id}">${escapeHtml(m.name)}</option>`).join('');
        }

        function renderCharts() {
            if (!stats) return;
            const box = document.getElementById('barChart');
            const max = Math.max(...Object.values(stats.monthly).map(m => Math.max(m.income, m.outcome)), 1);
            box.innerHTML = Object.entries(stats.monthly).map(([mm, v]) => `
                <div class="bar-col">
                    <div class="bar-pair">
                        <div class="bar-in" style="height:${(v.income / max * 100)}%;" title="收 ${fmtMoney(v.income)}"></div>
                        <div class="bar-out" style="height:${(v.outcome / max * 100)}%;" title="支 ${fmtMoney(v.outcome)}"></div>
                    </div>
                    <div class="bar-label">${+mm}</div>
                </div>`).join('');
        }
        function toggleCharts() {
            const b = document.getElementById('chartBox');
            b.style.display = b.style.display === 'none' ? 'block' : 'none';
        }

        /* --- 记录 CRUD --- */
        function openGiftModal() {
            if (!persons.length) return showToast('请先添加往来对象', 'warning');
            editingId = null;
            document.getElementById('giftModalTitle').textContent = '新增记录';
            document.getElementById('gDirection').value = 'in';
            document.getElementById('gAmount').value = '';
            document.getElementById('gDate').value = todayStr();
            document.getElementById('gRemark').value = '';
            openModal('giftModal');
        }
        async function editGift(id) {
            const r = records.find(x => x.id === id);
            editingId = id;
            document.getElementById('giftModalTitle').textContent = '编辑记录';
            document.getElementById('gPerson').value = r.personId;
            document.getElementById('gRelation').value = r.relation || '';
            document.getElementById('gEvent').value = r.eventType || '';
            document.getElementById('gDirection').value = r.direction;
            document.getElementById('gAmount').value = r.amount;
            document.getElementById('gDate').value = r.date;
            document.getElementById('gRemark').value = r.remark || '';
            openModal('giftModal');
        }
        async function saveGift() {
            const data = {
                personId: +document.getElementById('gPerson').value,
                relation: document.getElementById('gRelation').value,
                eventType: document.getElementById('gEvent').value,
                direction: document.getElementById('gDirection').value,
                amount: +document.getElementById('gAmount').value,
                date: document.getElementById('gDate').value,
                remark: document.getElementById('gRemark').value,
                memberId: (persons.find(p => p.id === +document.getElementById('gPerson').value) || {}).memberId || null
            };
            if (!data.personId || !data.amount || !data.date) return showToast('对象、金额、日期不能为空', 'warning');
            const r = editingId ? await apiPut('/api/gift-records/' + editingId, data) : await apiPost('/api/gift-records', data);
            if (r.code === 200) { showToast('保存成功'); closeModal('giftModal'); loadAll(); }
            else showToast(r.message || '保存失败', 'error');
        }
        async function removeGift(id) {
            const rec = records.find(x => x.id === id);
            const desc = rec ? (rec.date + ' · ' + personName(rec.personId) + ' · ' + (rec.direction === 'in' ? '收' : '支') + ' ' + fmtMoney(rec.amount)) : '';
            if (!(await confirmDel('确定删除这笔人情记录吗？（' + desc + '）'))) return;
            const r = await apiDelete('/api/gift-records/' + id);
            if (r.code === 200) { showToast('删除成功'); loadAll(); }
        }

        /* --- 往来对象 --- */
        async function openPersonModal() {
            renderPersonList();
            openModal('personModal');
        }
        function renderPersonList() {
            const box = document.getElementById('personList');
            if (!persons.length) { box.innerHTML = ''; box.appendChild(uiEmpty({ text: '暂无对象' })); return; }
            box.innerHTML = persons.map(p => {
                const g = groups.find(x => x.id === p.groupId);
                return `<div class="vault-item">
                    <div class="v-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
                    <div class="v-info"><div class="v-title">${escapeHtml(p.name)}</div>
                    <div class="v-user">${g ? escapeHtml(g.name) : '未分组'}${p.memberId ? ' · ' + (memberAvatarFor(p.memberId) || '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>') + ' ' + escapeHtml(memberName(p.memberId)) : ''}${p.birthday ? ' · <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"/><path d="M2 21h20"/><path d="M7 8v3"/><path d="M12 8v3"/><path d="M17 8v3"/><path d="M7 4h.01M12 4h.01M17 4h.01"/></svg> ' + escapeHtml(p.birthday) : ''}</div></div>
                    <input type="date" value="${p.birthday || ''}" title="生日（可选，YYYY-MM-DD）" style="width:auto;font-size:12px;" onchange="linkPersonBirthday(${p.id}, this.value)">
                    <select style="width:auto;font-size:12px;" title="关联家人" onchange="linkPersonMember(${p.id}, this.value)">
                        <option value="">关联家人…</option>
                        ${members.map(m => `<option value="${m.id}"${p.memberId === m.id ? ' selected' : ''}>${escapeHtml(m.name)}</option>`).join('')}
                        ${p.memberId ? '<option value="0">取消关联</option>' : ''}
                    </select>
                    <button class="icon-btn danger" title="删除往来对象" aria-label="删除往来对象" onclick="removePerson(${p.id})"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>
                </div>`;
            }).join('');
        }
        async function linkPersonMember(personId, memberId) {
            const r = await apiPut('/api/gift-persons/' + personId, { memberId: memberId === '0' ? null : (memberId || null) });
            if (r.code === 200) { showToast('已更新关联'); loadAll(); }
            else showToast(r.message || '更新失败', 'error');
        }
        async function addPerson() {
            const name = document.getElementById('newPersonName').value.trim();
            const groupId = document.getElementById('newPersonGroup').value || null;
            const memberId = document.getElementById('newPersonMember').value || null;
            const birthday = document.getElementById('newPersonBirthday').value || null;
            if (!name) return showToast('请输入姓名', 'warning');
            const r = await apiPost('/api/gift-persons', { name, groupId: groupId ? +groupId : null, memberId: memberId ? +memberId : null, birthday });
            if (r.code === 200) {
                document.getElementById('newPersonName').value = '';
                document.getElementById('newPersonBirthday').value = '';
                persons = (await apiGet('/api/gift-persons')).data;
                renderPersonList(); renderFilters();
                showToast('添加成功');
            }
        }
        async function linkPersonBirthday(personId, birthday) {
            const r = await apiPut('/api/gift-persons/' + personId, { birthday: birthday || null });
            if (r.code === 200) { showToast('已更新生日'); persons = (await apiGet('/api/gift-persons')).data; renderPersonList(); loadAll(); }
            else showToast(r.message || '更新失败', 'error');
        }
        async function removePerson(id) {
            if (!(await confirmDel('删除后相关记录的对象将显示为"未知"，确定？'))) return;
            await apiDelete('/api/gift-persons/' + id);
            persons = (await apiGet('/api/gift-persons')).data;
            renderPersonList(); loadAll();
        }

        /* --- 分组 --- */
        async function openGroupModal() { renderGroupList(); openModal('groupModal'); }
        function renderGroupList() {
            const box = document.getElementById('groupList');
            if (!groups.length) { box.innerHTML = ''; box.appendChild(uiEmpty({ text: '暂无分组' })); return; }
            box.innerHTML = groups.map(g => `
                <div class="vault-item">
                    <div class="v-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
                    <div class="v-info"><div class="v-title">${escapeHtml(g.name)}</div></div>
                    <button class="icon-btn danger" title="删除分组" aria-label="删除分组" onclick="removeGroup(${g.id})"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>
                </div>`).join('');
        }
        async function addGroup() {
            const name = document.getElementById('newGroupName').value.trim();
            if (!name) return showToast('请输入分组名', 'warning');
            await apiPost('/api/gift-groups', { name });
            document.getElementById('newGroupName').value = '';
            groups = (await apiGet('/api/gift-groups')).data;
            renderGroupList(); renderFilters();
            showToast('添加成功');
        }
        async function removeGroup(id) {
            if (!(await confirmDel('确定删除该分组？'))) return;
            await apiDelete('/api/gift-groups/' + id);
            groups = (await apiGet('/api/gift-groups')).data;
            renderGroupList(); loadAll();
        }

        /* --- 配置 --- */
        async function openConfigModal() { renderConfigLists(); openModal('configModal'); }
        function renderConfigLists() {
            document.getElementById('eventTypeList').innerHTML = events.map(e => `
                <div class="vault-item" style="padding:8px 10px;margin-bottom:6px;">
                    <div class="v-info"><div class="v-title" style="font-weight:400;">${escapeHtml(e.label)}</div></div>
                    <button class="icon-btn danger" title="删除配置" aria-label="删除配置" onclick="removeConfig(${e.id})"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>
                </div>`).join('') || '<div style="font-size:12px;color:var(--text-secondary);">暂无</div>';
            document.getElementById('relationTypeList').innerHTML = relations.map(e => `
                <div class="vault-item" style="padding:8px 10px;margin-bottom:6px;">
                    <div class="v-info"><div class="v-title" style="font-weight:400;">${escapeHtml(e.label)}</div></div>
                    <button class="icon-btn danger" title="删除配置" aria-label="删除配置" onclick="removeConfig(${e.id})"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg></button>
                </div>`).join('') || '<div style="font-size:12px;color:var(--text-secondary);">暂无</div>';
        }
        async function addConfig(type) {
            const inputId = type === 'EVENT_TYPE' ? 'newEventLabel' : 'newRelationLabel';
            const label = document.getElementById(inputId).value.trim();
            if (!label) return showToast('请输入名称', 'warning');
            await apiPost('/api/gift-configs', { type, label });
            document.getElementById(inputId).value = '';
            const [eRes, relRes] = await Promise.all([
                apiGet('/api/gift-configs?type=EVENT_TYPE'), apiGet('/api/gift-configs?type=RELATION_TYPE')]);
            events = eRes.data; relations = relRes.data;
            renderConfigLists(); renderFilters();
        }
        async function removeConfig(id) {
            const cfg = events.concat(relations).find(x => x.id === id);
            if (!(await confirmDel('确定删除配置项「' + (cfg ? cfg.label : '') + '」吗？已使用该配置的历史记录不会被删除。'))) return;
            await apiDelete('/api/gift-configs/' + id);
            const [eRes, relRes] = await Promise.all([
                apiGet('/api/gift-configs?type=EVENT_TYPE'), apiGet('/api/gift-configs?type=RELATION_TYPE')]);
            events = eRes.data; relations = relRes.data;
            renderConfigLists(); loadAll();
        }

        /* --- 导出 --- */
        function csvCell(v) {
            const s = String(v == null ? '' : v);
            return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
        }
        function exportCSV() {
            if (!records.length) return showToast('暂无数据可导出', 'warning');
            let csv = '\ufeff日期,对象,关系,事项,方向,金额,备注\n';
            records.forEach(r => {
                csv += [r.date, personName(r.personId), r.relation || '', r.eventType || '',
                    r.direction === 'in' ? '收入' : '支出', r.amount, r.remark || ''].map(csvCell).join(',') + '\n';
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = '人情记账_' + todayStr() + '.csv';
            a.click();
        }

        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        loadAll();
    </script>
</body>
</html>
